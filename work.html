<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listen — Office Oficina</title>
<link rel="stylesheet" href="style.css?v=44">
<style>
  /* a record spinning in the middle of the page; the songs listed to its right */
  html,body{height:100%;overflow:hidden}
  .home{position:fixed;left:clamp(1rem,3vw,2.5rem);top:clamp(1rem,3vw,2.5rem);z-index:2}
  .room{position:fixed;inset:0}
  .record{position:absolute;left:50%;top:50%;width:min(62vw,62vh,520px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:0;padding:0;
    background:radial-gradient(circle,#fff 0 13.5%,#111 13.6% 14.2%,transparent 14.3%),repeating-radial-gradient(circle,#0b0b0b 0 2px,#1d1d1d 2.5px 3px),#111;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
    cursor:url(cursor-move.png) 11 11,pointer;cursor:-webkit-image-set(url(cursor-move.png) 1x,url(cursor-move@2x.png) 2x) 11 11,pointer}
  .record .disc{position:absolute;inset:0;border-radius:50%;animation:spin 1.8s linear infinite;animation-play-state:paused}
  .record .disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 10%,rgba(255,255,255,.06) 14%,transparent 18% 60%,rgba(255,255,255,.05) 64%,transparent 68%)}
  .record .disc::after{content:"";position:absolute;left:50%;top:50%;width:2.4%;height:2.4%;margin:-1.2% 0 0 -1.2%;border-radius:50%;background:#000}
  .record .mark{position:absolute;left:50%;top:50%;width:5.5%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:flex-end;gap:5%}
  .record .mark i{display:block;width:100%;aspect-ratio:1.09;border-radius:50%;background:#000}
  .record .mark b{display:block;width:70%;aspect-ratio:1.05;background:#000;clip-path:polygon(0 0,100% 39%,100% 61%,0 100%)}
  .playing .record .disc{animation-play-state:running}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* the songs, to the right of the record; the one playing is black */
  .songs{position:absolute;top:50%;left:calc(50% + min(31vw,31vh,260px) + clamp(1.5rem,4vw,4rem));transform:translateY(-50%);
    list-style:none;margin:0;padding:0;display:grid;gap:.55em;font-size:.9em;max-width:calc(50vw - min(31vw,31vh,260px) - 5rem)}
  .songs button{font:inherit;color:#999;background:none;border:0;padding:0;text-align:left;display:flex;gap:.8em;
    cursor:url(cursor-move.png) 11 11,pointer;cursor:-webkit-image-set(url(cursor-move.png) 1x,url(cursor-move@2x.png) 2x) 11 11,pointer}
  .songs button:hover{color:#555}
  .songs .on button{color:#000}
  .songs .n{font-variant-numeric:tabular-nums;min-width:1.4em}
  @media (max-width:700px){
    .record{top:40%;width:min(78vw,52vh)}
    .songs{left:50%;top:calc(40% + min(39vw,26vh) + 2rem);transform:translateX(-50%);max-width:86vw;font-size:.85em}
  }
  @media (prefers-reduced-motion:reduce){.record .disc{animation-duration:8s}}
</style>
</head>
<body>
<a class="home" href="index.html">Office Oficina</a>
<main class="room" id="room">
  <button class="record" id="record" type="button" aria-label="Pause">
    <span class="disc"><span class="mark" aria-hidden="true"><i></i><i></i><b></b></span></span>
  </button>
  <ol class="songs" id="songs" aria-label="Songs"></ol>
</main>

<script>
/* ==================================================================
   SONGS
   Put your music files in a  music/  folder next to this page and list
   them here, in order - they show up in the list next to the record.
   While this list is empty, a few little tunes made right here in the
   browser play instead.
   ================================================================== */
var SONGS = [
  // {title:"Song title", src:"music/song-1.mp3"},
  // {title:"Another song", src:"music/song-2.mp3"},
];

(function(){
  var room=document.getElementById("room"),rec=document.getElementById("record"),ol=document.getElementById("songs"),
      i=0,playing=false,audio=null,ctx=null,timer=null,voices=[],justUnlocked=false;

  /* the stand-in tunes: simple melodies over a bass line, played by the browser itself */
  var N=function(n){return 440*Math.pow(2,(n-69)/12)};
  var DEMOS=[
    {title:"Tune 01",bpm:92,mel:[64,67,71,72,71,67,64,62,60,64,67,69,67,64,62,60],bass:[48,48,43,43,45,45,41,43]},
    {title:"Tune 02",bpm:78,mel:[69,72,76,74,72,69,67,69,72,74,76,79,76,74,72,69],bass:[45,45,41,41,48,48,43,43]},
    {title:"Tune 03",bpm:104,mel:[62,66,69,74,73,69,66,64,62,64,66,69,71,69,66,62],bass:[50,50,47,47,43,43,45,45]},
    {title:"Tune 04",bpm:84,mel:[67,71,74,76,74,71,69,67,65,69,72,74,72,69,67,65],bass:[43,43,40,40,41,41,38,43]},
    {title:"Tune 05",bpm:96,mel:[60,63,67,70,68,67,63,62,60,62,63,67,65,63,62,60],bass:[48,48,44,44,46,46,43,43]}
  ];
  var list=SONGS.length?SONGS:DEMOS;

  // the list next to the record: click a song to put it on
  list.forEach(function(s,k){
    var li=document.createElement("li"),b=document.createElement("button");b.type="button";
    b.innerHTML='<span class="n">'+("0"+(k+1)).slice(-2)+'</span><span></span>';b.lastChild.textContent=s.title;
    b.addEventListener("click",function(){i=k;start()});li.appendChild(b);ol.appendChild(li);
  });
  function mark(){[].forEach.call(ol.children,function(li,k){li.classList.toggle("on",k===i);li.firstChild.setAttribute("aria-current",k===i?"true":"false")})}

  function tone(t,f,d,type,vol){
    var o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.05);voices.push(o);
  }
  function playDemo(d){
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();
    var beat=60/d.bpm/2,t0=ctx.currentTime+.08,loops=4,total=d.mel.length*beat*loops;
    for(var l=0;l<loops;l++){
      d.mel.forEach(function(n,k){tone(t0+(l*d.mel.length+k)*beat,N(n),beat*1.6,"triangle",.14)});
      d.bass.forEach(function(n,k){tone(t0+(l*d.bass.length+k)*beat*2,N(n),beat*2.2,"sine",.2)});
    }
    timer=setTimeout(next,total*1000+300);
  }
  function stopAll(){clearTimeout(timer);voices.forEach(function(o){try{o.stop()}catch(e){}});voices=[];if(audio){audio.pause();audio=null}}
  function start(){
    var s=list[i];stopAll();playing=true;room.classList.add("playing");rec.setAttribute("aria-label","Pause");mark();
    if(s.src){audio=new Audio(s.src);audio.addEventListener("ended",next);audio.play().catch(waitForTap)}
    else{playDemo(s);if(ctx.state!=="running")waitForTap()}
  }
  function pause(){stopAll();playing=false;room.classList.remove("playing");rec.setAttribute("aria-label","Play")}
  function next(){i=(i+1)%list.length;start()}
  // browsers only allow sound after a tap on the page: the record already spins, the music joins on the first tap
  function waitForTap(){
    var go=function(e){removeEventListener("pointerdown",go,true);removeEventListener("keydown",go,true);
      if(playing&&!(e.target.closest&&e.target.closest(".songs"))){justUnlocked=true;setTimeout(function(){justUnlocked=false},500);start()}};
    addEventListener("pointerdown",go,true);addEventListener("keydown",go,true);
  }
  rec.addEventListener("click",function(){if(justUnlocked)return;if(playing)pause();else start()});

  start();   // you came in through ENTER: the record is already turning
})();
</script>
</body>
</html>
