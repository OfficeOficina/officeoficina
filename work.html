<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listen — Office Oficina</title>
<link rel="stylesheet" href="style.css?v=90">
<style>
  /* a record spinning in the middle of the page; the songs listed to its right */
  html,body{height:100%;overflow:hidden}
  .room{position:fixed;inset:0}
  /* the book (open, two pages) and the record sit side by side, centred together on the page */
  .room{--R:min(25vw,52vh,420px);--B:calc(var(--R)*1.05*935/1210);--gap:clamp(1.2rem,3vw,3.5rem);--W:calc(var(--B)*2 + var(--gap) + var(--R))}
  .pair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:var(--gap)}
  .record{position:relative;flex:none;width:var(--R);aspect-ratio:1;border-radius:50%;border:0;padding:0;    background:radial-gradient(circle,#fff 0 13.5%,#111 13.6% 14.2%,transparent 14.3%),repeating-radial-gradient(circle,#0b0b0b 0 2px,#1d1d1d 2.5px 3px),#111;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
    cursor:pointer}
  .record .disc{position:absolute;inset:0;border-radius:50%;animation:spin 1.8s linear infinite;animation-play-state:paused}
  .record .disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 10%,rgba(255,255,255,.06) 14%,transparent 18% 60%,rgba(255,255,255,.05) 64%,transparent 68%)}
  .record .disc::after{content:"";position:absolute;left:50%;top:50%;width:2.4%;height:2.4%;margin:-1.2% 0 0 -1.2%;border-radius:50%;background:#000}
  .record .mark{position:absolute;left:50%;top:50%;width:5.5%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:flex-end;gap:5%}
  .record .mark i{display:block;width:100%;aspect-ratio:1.09;border-radius:50%;background:#000}
  .record .mark b{display:block;width:70%;aspect-ratio:1.05;background:#000;clip-path:polygon(0 0,100% 39%,100% 61%,0 100%)}
  .playing .record .disc{animation-play-state:running}
  .record.hasart{background:#c97a18}.record.hasart .mark{display:none}   /* a record with its own picture (e.g. the orange vinyl) */
  @keyframes spin{to{transform:rotate(360deg)}}
  /* the songs, to the right of the record; the one playing is black */
  .side{position:absolute;top:50%;left:calc(50% + var(--W)/2 + var(--gap));transform:translateY(-50%);
    display:grid;gap:1.6rem;max-width:calc(50vw - var(--W)/2 - var(--gap) - 1rem)}
  /* the books, listed to the left of the book, numbered like the songs */
  .lside{position:absolute;top:50%;right:calc(50% + var(--W)/2 + var(--gap));transform:translateY(-50%);max-width:calc(50vw - var(--W)/2 - var(--gap) - 1rem)}
  /* the book: an open spread, left page and right page; click or swipe the right page forward, the left page back */
  .book{position:relative;flex:none;width:calc(var(--B)*2);aspect-ratio:1870/1210;perspective:2400px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:pointer}
  .book .pl,.book .pr{position:absolute;top:0;bottom:0;width:50%;background:#fff center/contain no-repeat}
  .book .pl{left:0}.book .pr{right:0}
  .book .pl.blank,.book .pr.blank{background:transparent}
  .book .leaf{position:absolute;top:0;bottom:0;left:50%;width:50%;transform-origin:0 50%;transform-style:preserve-3d;z-index:2}
  .book .leaf i{position:absolute;inset:0;background:#fff center/contain no-repeat;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .book .leaf i.bk{transform:rotateY(180deg)}
  .book .leaf.fwd{animation:bFwd .7s cubic-bezier(.45,.05,.3,1) forwards}
  .book .leaf.rev{animation:bRev .7s cubic-bezier(.45,.05,.3,1) forwards}
  @keyframes bFwd{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}
  @keyframes bRev{from{transform:rotateY(-180deg)}to{transform:rotateY(0)}}
  .songs{list-style:none;margin:0;padding:0;display:grid;gap:.55em;font-size:.9em}
  .songs button{display:grid;grid-template-columns:auto 1fr;column-gap:.8em}
  .songs .by{grid-column:2;color:#999;font-size:.85em}
  /* the Spotify player: the small bar under the songs (no ads; full songs for people logged into Spotify, 30-second previews otherwise) */
  .sp{width:min(300px,86vw);height:80px;border-radius:12px;overflow:hidden}
  .sp[hidden]{display:none}
  .sp iframe{display:block;width:100%;height:80px;border:0}
  .songs button{font:inherit;color:#999;background:none;border:0;padding:0;text-align:left;display:grid;grid-template-columns:auto 1fr;column-gap:.8em;
    cursor:pointer}
  .songs button:hover{color:#555}
  .songs .on button{color:#000}
  .songs .n{font-variant-numeric:tabular-nums;min-width:1.4em}
  @media (max-width:700px){
    html,body{overflow:auto}
    .room{position:static;min-height:100dvh;--R:min(64vw,40vh);--B:min(46vw,calc(40vh*935/1210));padding:5.5rem 0 2rem;display:flex;flex-direction:column;align-items:center;gap:2rem}
    .lside{position:static;transform:none;max-width:86vw}
    .pair{position:static;transform:none;flex-direction:column;gap:3rem}
    .side{position:static;transform:none;max-width:86vw;justify-items:center}
    .songs{font-size:.85em}
  }
  /* the logo on the record: its place flashes while you hold that shape; the dive */
  .record .mark .hint{animation:markPulse 1s ease-in-out infinite}
  @keyframes markPulse{0%,100%{background:#000}50%{background:#b0b0b0}}
  .record .mark .flash{animation:markFlash .4s ease-out}
  @keyframes markFlash{from{background:#fff}to{background:#000}}
  .m.gone{visibility:hidden}
  html.dive,html.dive body{background:#000;transition:background .9s}
  html.dive .book,html.dive .lside,html.dive .side,html.dive .logo{opacity:0;transition:opacity .7s;pointer-events:none}
  html.dive body{overflow:hidden}
  html.back,html.back body{transition:background 1.2s}
  html.back .book,html.back .lside,html.back .side,html.back .logo{transition:opacity 1.2s}
  .tunnel{position:fixed;inset:0;width:100vw;height:100vh;z-index:50;animation:tIn .35s ease-out}
  @keyframes tIn{from{opacity:0}to{opacity:1}}
  .ptw{position:fixed;inset:0;z-index:51;display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(1.4rem,3vw,2.4rem);opacity:0;transition:opacity 1.6s ease;pointer-events:none}
  .ptw.on{opacity:1}
  @media (prefers-reduced-motion:reduce){.record .disc{animation-duration:8s}}
  /* the lounge: just the plan, in the middle of the screen */
  .lounge .pair,.lounge .side,.lounge .lside{display:none}
  .plan{display:none}
  .lounge .plan{display:block;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(56vh,84vw,640px);height:auto;
    user-select:none;-webkit-user-select:none;-webkit-user-drag:none;pointer-events:none}
</style>

    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.05);voices.push(o);
  }
  function playDemo(d){
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();
    var beat=60/d.bpm/2,t0=ctx.currentTime+.08,loops=4,total=d.mel.length*beat*loops;
    for(var l=0;l<loops;l++){
      d.mel.forEach(function(n,k){tone(t0+(l*d.mel.length+k)*beat,N(n),beat*1.6,"triangle",.14)});
      d.bass.forEach(function(n,k){tone(t0+(l*d.bass.length+k)*beat*2,N(n),beat*2.2,"sine",.2)});
    }
    timer=setTimeout(next,total*1000+300);
  }
  /* Spotify songs play in the small Spotify bar; the record turns while it plays */
  var sp=null,spWant=null,spCur=null,spEnded=null,spBox=document.getElementById("sp"),spPlaying=false;
  if(list.some(function(s){return s.spotify})){
    spBox.hidden=false;
    window.onSpotifyIframeApiReady=function(API){
      var first=(list.filter(function(s){return s.spotify})[0]||{}).spotify;spCur=first;
      API.createController(document.getElementById("spp"),{uri:"spotify:track:"+first,width:"100%",height:80},function(c){
        sp=c;
        c.addListener("playback_update",function(e){
          var d=e.data||{};if(!list[i].spotify)return;
          var on=!d.isPaused&&!d.isBuffering;
          if(on!==spPlaying){spPlaying=on;playing=on;room.classList.toggle("playing",on);rec.setAttribute("aria-label",on?"Pause":"Play")}
          if(d.duration>0&&d.isPaused&&d.position>=d.duration-600&&d.position>0&&spEnded!==spCur){spEnded=spCur;next()}     // song finished: next one
        });
        if(spWant)spPlay(spWant);
      });
    };
    var st=document.createElement("script");st.src="https://open.spotify.com/embed/iframe-api/v1";st.async=true;document.head.appendChild(st);
  }
  function spPlay(id){if(!sp){spWant=id;return}spWant=null;
    if(spCur===id){sp.resume?sp.resume():sp.play()}else{spCur=id;spEnded=null;sp.loadUri("spotify:track:"+id);sp.play()}}
  function stopAll(){clearTimeout(timer);voices.forEach(function(o){try{o.stop()}catch(e){}});voices=[];if(audio){audio.pause();audio=null}if(sp&&spPlaying)sp.pause()}
  function start(){
    var s=list[i],dk=rec.querySelector(".disc");dk.style.background=s.art?"url("+s.art+") center/cover":"";rec.classList.toggle("hasart",!!s.art);rec.style.background=s.art?"transparent":"";stopAll();playing=true;room.classList.add("playing");rec.setAttribute("aria-label","Pause");mark();
    if(s.spotify){room.classList.remove("playing");spPlay(s.spotify)}   // the record starts turning when Spotify actually plays
    else if(s.src){audio=new Audio(s.src);var tried=false,me=audio;audio.addEventListener("ended",next);
      audio.addEventListener("error",function(){if(tried||audio!==me)return;tried=true;audio.src=s.src.split("/").pop();audio.play().catch(waitForTap)});   // not in music/? try next to this page
      audio.play().catch(function(e){if(e&&e.name==="NotAllowedError")waitForTap()})}
    else{playDemo(s);if(ctx.state!=="running")waitForTap()}
  }
  function pause(){stopAll();playing=false;room.classList.remove("playing");rec.setAttribute("aria-label","Play")}
  function next(){i=(i+1)%list.length;start()}
  // browsers only allow sound after a tap on the page: the record already spins, the music joins on the first tap
  function waitForTap(){
    var go=function(e){removeEventListener("pointerdown",go,true);removeEventListener("keydown",go,true);
      if(playing&&!(e.target.closest&&e.target.closest(".songs"))){justUnlocked=true;setTimeout(function(){justUnlocked=false},500);start()}};
    addEventListener("pointerdown",go,true);addEventListener("keydown",go,true);
  }
  rec.addEventListener("click",function(){if(justUnlocked)return;if(playing)pause();else start()});

  if(list[0].spotify){mark();spPlay(list[0].spotify)}   // Spotify may wait for a first click (on the record or its bar) before it plays
  else{var PLAY=(location.search.match(/[?&]play=(\d+)/)||[])[1];
    if(PLAY!==undefined){i=(+PLAY)%list.length;start()}                  // the record you put on the player in the listening room
    else if(!document.body.classList.contains("lounge"))start();}
})();
</script>
<script>
/* the logo: drag any of the three shapes around; a click (without dragging) takes you home.
   Holding a shape makes its place in the little logo in the middle of the record flash (like the holes in the card).
   Drop all three into place and you fall into the record: a tunnel, faster and faster, then black space ... Poo-tee-weet? */
(function(){
  var link=document.querySelector(".logolink");if(!link)return;
  var rec=document.getElementById("record"),marks=[].slice.call(rec.querySelectorAll(".mark i,.mark b")),
      pieces=[].slice.call(link.querySelectorAll(".m")),filled=0,busy=false,hintTO=null,hintMouse=false;
  link.addEventListener("click",function(e){e.preventDefault()});
  function kind(el){return el.tagName==="B"||el.classList.contains("tri")?"t":"o"}
  function open(p){return marks.filter(function(t){return kind(t)===kind(p)&&!t.classList.contains("in")})}
  function hintOn(p,ptype){clearTimeout(hintTO);hintMouse=(ptype==="mouse");hintOff();open(p).forEach(function(t){t.classList.add("hint")})}
  function hintOff(){marks.forEach(function(t){t.classList.remove("hint")})}
  function hintRelease(){clearTimeout(hintTO);if(hintMouse){hintOff();return}hintTO=setTimeout(hintOff,3000)}   // mouse: only while held. touch: 3 s more
  function mid(r){return{x:r.left+r.width/2,y:r.top+r.height/2}}
  pieces.forEach(function(m){
    var d=null;m._x=0;m._y=0;
    function put(extra){m.style.transform="translate("+m._x+"px,"+m._y+"px)"+(extra||"")}
    m._reset=function(){m._x=0;m._y=0;m.style.transition="";m.style.transform="";m.classList.remove("gone")};
    m.addEventListener("pointerdown",function(e){e.preventDefault();if(busy||m.classList.contains("gone"))return;d={px:e.clientX,py:e.clientY,x:m._x,y:m._y,moved:false};m.setPointerCapture(e.pointerId);m.classList.add("dragging");hintOn(m,e.pointerType)});
    m.addEventListener("pointermove",function(e){
      if(!d)return;if(!d.moved){if(Math.hypot(e.clientX-d.px,e.clientY-d.py)<5)return;d.moved=true;m.classList.remove("mir")}
      var ox=m._x,oy=m._y;m._x=d.x+e.clientX-d.px;m._y=d.y+e.clientY-d.py;put();
      var r=m.getBoundingClientRect();if(r.right<12||r.left>innerWidth-12||r.bottom<12||r.top>innerHeight-12){m._x=ox;m._y=oy;put()}
    });
    function up(){var was=d;d=null;m.classList.remove("dragging");if(!was)return;
      if(!was.moved){hintOff();if(m.classList.contains("tri")){if(!m.classList.contains("mir")){m.classList.add("mir");return}m.classList.remove("mir");   // the mirrored A: back to where you were
        if(/[?&]play=/.test(location.search))location.href="index.html#north";                       // came with a record: back to the record shelf
        else if(document.referrer&&document.referrer.indexOf(location.origin)===0&&history.length>1)history.back();else location.href=link.getAttribute("href");return}
      location.href=link.getAttribute("href");return}
      hintRelease();drop(m,put);setTimeout(skullCheck,30)}
    m.addEventListener("pointerup",up);m.addEventListener("pointercancel",function(){d=null;m.classList.remove("dragging");hintOff()});
  });
  link.addEventListener("keydown",function(e){if(e.key==="Enter")location.href=link.getAttribute("href")});

  /* the skull (same as on the home page): the two dots one above the other, the triangle to their left pointing at the gap */
  var skullBusy=false;
  function skullCheck(){
    if(skullBusy||busy)return;
    if(pieces.some(function(m){return m.classList.contains("gone")}))return;
    var ds=pieces.filter(function(m){return m.classList.contains("dot")}).map(function(m){return m.getBoundingClientRect()}),
        t=link.querySelector(".tri").getBoundingClientRect();if(ds.length<2)return;
    var D=ds[0].height,c=function(r){return{x:r.left+r.width/2,y:r.top+r.height/2}},a=c(ds[0]),b=c(ds[1]),n=c(t);
    if(a.y>b.y){var z=a;a=b;b=z}
    var midY=(a.y+b.y)/2,dotsX=(a.x+b.x)/2;
    if(Math.abs(a.x-b.x)<.7*D&&b.y-a.y>1.2*D&&b.y-a.y<3.6*D&&Math.abs(n.y-midY)<.7*D&&dotsX-n.x>.5*D&&dotsX-n.x<3.2*D)skull(pieces);
  }
  function skull(ms){
    skullBusy=true;busy=true;
    var fx=document.createElement("div");fx.className="skullfx";document.body.appendChild(fx);
    var rs=ms.map(function(m){return m.getBoundingClientRect()}),
        cx=rs.reduce(function(s,r){return s+r.left+r.width/2},0)/3,cy=rs.reduce(function(s,r){return s+r.top+r.height/2},0)/3;
    var grp=document.createElement("div");grp.className="skgrp";grp.style.left=cx+"px";grp.style.top=cy+"px";fx.appendChild(grp);
    ms.forEach(function(m,k){var r=rs[k],cl=m.cloneNode(true);cl.className=m.className.replace("dragging","")+" skp";
      cl.style.cssText="position:absolute;margin:0;left:"+(r.left-cx)+"px;top:"+(r.top-cy)+"px;width:"+r.width+"px;height:"+r.height+"px";
      grp.appendChild(cl);m.style.visibility="hidden"});
    var ds=rs.filter(function(r,k){return ms[k].classList.contains("dot")}),eye=Math.abs((ds[0].top+ds[0].height/2)-(ds[1].top+ds[1].height/2)),
        S=Math.min(innerWidth,innerHeight)*.26/eye;
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      grp.style.transform="translate("+(innerWidth/2-cx)+"px,"+(innerHeight/2-cy)+"px) rotate(-90deg) scale("+S+")";
    })});
    setTimeout(function(){fx.classList.add("dark")},1500);
    setTimeout(function(){
      var ps=[].slice.call(grp.querySelectorAll(".skp")).map(function(e){var r=e.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,dot:e.classList.contains("dot")}}),
          ey=ps.filter(function(p){return p.dot}),ex=(ey[0].x+ey[1].x)/2,eyy=(ey[0].y+ey[1].y)/2,k=Math.abs(ey[0].x-ey[1].x)/36;
      var sv=document.createElementNS("http://www.w3.org/2000/svg","svg");sv.setAttribute("viewBox","0 0 100 120");sv.setAttribute("class","skullsvg");
      sv.style.width=(100*k)+"px";sv.style.height=(120*k)+"px";sv.style.left=(ex-50*k)+"px";sv.style.top=(eyy-52*k)+"px";
      sv.innerHTML='<path fill="#fff" d="M50 4C24 4 8 22 8 46c0 14 5 24 12 30v12c0 4 4 6 8 6h4v10c0 4 4 8 10 8h16c6 0 10-4 10-8V94h4c4 0 8-2 8-6V76c7-6 12-16 12-30C92 22 76 4 50 4z"/>'+
        '<g stroke="#000" stroke-width="1.4" stroke-linecap="round"><path d="M41 97v12M47 97v13M53 97v13M59 97v12"/></g>';
      fx.insertBefore(sv,grp);requestAnimationFrame(function(){sv.classList.add("on")});
    },2600);
    setTimeout(function(){fx.classList.add("gone")},4800);
    setTimeout(function(){fx.remove();ms.forEach(function(m){m._reset();m.style.visibility=""});skullBusy=false;busy=false},8200);
  }

  /* dropped close enough to its place on the record: it shrinks into it and becomes part of the record's logo */
  function drop(m,put){
    if(!rec.offsetParent)return;                   // the record is put away (the lounge): nothing to drop into
    var pr=m.getBoundingClientRect(),pc=mid(pr),best=null,bd=1e9;
    open(m).forEach(function(t){var c=mid(t.getBoundingClientRect()),dd=Math.hypot(c.x-pc.x,c.y-pc.y);if(dd<bd){bd=dd;best=t}});
    if(!best)return;var tr=best.getBoundingClientRect(),tc=mid(tr);
    if(bd>Math.max(tr.width*.9,pr.width*.5,14))return;
    best.classList.add("in");best.classList.remove("hint");filled++;
    m._x+=tc.x-pc.x;m._y+=tc.y-pc.y;m.style.transition="transform .22s ease-out";put(" scale("+(tr.width/pr.width)+")");
    setTimeout(function(){m.classList.add("gone");m.style.transition="";best.classList.add("flash");setTimeout(function(){best.classList.remove("flash")},400)},220);
    if(filled===marks.length){busy=true;clearTimeout(hintTO);hintOff();setTimeout(dive,700)}
  }

  /* the dive: the record glides to the middle, the lights go out, and you fall into it */
  function dive(){
    var root=document.documentElement,r=rec.getBoundingClientRect(),c=mid(r),R=r.width/2;
    var dx=innerWidth/2-c.x,dy=innerHeight/2-c.y;
    root.classList.add("dive");
    rec.style.transition="transform 1.1s cubic-bezier(.6,0,.3,1)";rec.style.transform="translate("+dx+"px,"+dy+"px)";
    var cv=document.createElement("canvas"),msg=document.createElement("div");cv.className="tunnel";msg.className="ptw";msg.textContent="Poo-tee-weet?";
    document.body.appendChild(cv);document.body.appendChild(msg);
    setTimeout(function(){tunnel(cv,R,function(){             // reached full speed: black space
      setTimeout(function(){msg.classList.add("on")},1100);
      setTimeout(function(){msg.classList.remove("on")},4300);
      setTimeout(reset,6300);
    })},1300);
    function reset(){
      root.classList.add("back");rec.style.transition="none";rec.style.transform="";
      marks.forEach(function(t){t.classList.remove("in")});pieces.forEach(function(p){p._reset()});filled=0;
      cv.style.transition="opacity 1.2s";cv.style.opacity="0";
      setTimeout(function(){root.classList.remove("dive")},30);
      setTimeout(function(){cv.remove();msg.remove();root.classList.remove("back");rec.style.transition="";busy=false},1300);
    }
  }

  /* the tunnel: the grooves of the record become rings flying past you; at the far end, a white circle the size of the record */
  function tunnel(cv,R,done){
    var dpr=Math.min(devicePixelRatio||1,2),W=innerWidth,H=innerHeight,x=cv.getContext("2d");
    cv.width=W*dpr;cv.height=H*dpr;x.scale(dpr,dpr);
    var cx=W/2,cy=H/2,diag=Math.hypot(W,H)/2+20,K=.02,gap=.006,N=170,D=N*gap,rings=[],t0=null,last=0,L0=R*.135,END=5200;
    for(var n=0;n<N;n++)rings.push({d:D-n*gap,s:n%3?1:.45});   // every third groove a little dimmer
    x.fillStyle="#000";x.fillRect(0,0,W,H);
    function frame(now){
      if(t0===null){t0=now;last=now}
      var t=now-t0,dt=Math.min(50,now-last)/1000;last=now;
      if(t>=END){x.globalAlpha=1;x.fillStyle="#000";x.fillRect(0,0,W,H);done();return}
      var k=Math.min(1,t/1000),e=k*k*(3-2*k),                     // first second: the label opens up to the size of the record
          Rw=L0+(R-L0)*e,
          v=.02*Math.exp(Math.max(0,t-400)/1000*1.05),               // faster and faster
          fast=Math.min(1,v/1.2),
          jx=fast>.3?(Math.random()-.5)*fast*6:0,jy=fast>.3?(Math.random()-.5)*fast*6:0;
      x.globalAlpha=1;x.fillStyle="rgba(0,0,0,"+(1-.72*fast)+")";x.fillRect(0,0,W,H);   // trails when fast
      rings.forEach(function(g){
        g.d-=v*dt;while(g.d<=.0004)g.d+=D;
        var r=Rw*(1+K/g.d);if(r>diag)return;
        var a=Math.min(1,(r/Rw-1)/.08)*Math.min(1,(1-g.d/D)*4)*.5*g.s*e;
        if(a<=0)return;
        x.globalAlpha=a;x.strokeStyle="#fff";x.lineWidth=Math.max(.6,.7*r/Rw);
        x.beginPath();x.arc(cx+jx*(r/diag),cy+jy*(r/diag),r,0,6.2832);x.stroke();
      });
      x.globalAlpha=1;x.fillStyle="#fff";x.beginPath();x.arc(cx,cy,Rw,0,6.2832);x.fill();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
})();
</script>
<script>
/* the book: the PDF's pages as pictures, read as an open book - a page on the left, a page on the right */
(function(){
  var N=49,DIR="books/entrance/p-",book=document.getElementById("book"),L=book.querySelector(".pl"),Rp=book.querySelector(".pr"),
      S=Math.ceil(N/2),s=0,busy=false;                        // spread s: left page 2s-1, right page 2s (the cover sits alone on the right)
  function src(k){return DIR+("0"+(k+1)).slice(-2)+".jpg"}
  function set(el,k){if(k>=0&&k<N){el.classList.remove("blank");el.style.backgroundImage='url("'+src(k)+'")'}else{el.classList.add("blank");el.style.backgroundImage=""}}
  function pre(k){if(k>=0&&k<N)new Image().src=src(k)}
  function show(){set(L,2*s-1);set(Rp,2*s);pre(2*s+1);pre(2*s+2);pre(2*s-2);pre(2*s-3)}
  function face(k,cls){var i=document.createElement("i");if(cls)i.className=cls;if(k>=0&&k<N)i.style.backgroundImage='url("'+src(k)+'")';else i.style.background="transparent";return i}
  function turn(d){
    var to=s+d;if(busy||to<0||to>S-1+(N%2?0:1))return;busy=true;
    var lf=document.createElement("div");lf.className="leaf "+(d>0?"fwd":"rev");
    if(d>0){lf.appendChild(face(2*s));lf.appendChild(face(2*to-1,"bk"));set(Rp,2*to)}      // the right page turns over onto the left
    else{lf.appendChild(face(2*to));lf.appendChild(face(2*s-1,"bk"));set(L,2*to-1)}        // the left page turns back onto the right
    book.appendChild(lf);
    lf.addEventListener("animationend",function(){s=to;show();lf.remove();busy=false},{once:true});
  }
  var x0=null,y0=null;
  book.addEventListener("pointerdown",function(e){x0=e.clientX;y0=e.clientY});
  book.addEventListener("pointerup",function(e){
    if(x0===null)return;var dx=e.clientX-x0,dy=e.clientY-y0;x0=null;
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){turn(dx<0?1:-1);return}                    // swipe left: forward, swipe right: back
    var r=book.getBoundingClientRect();turn(e.clientX>r.left+r.width/2?1:-1);                 // click the right page: forward, the left page: back
  });
  book.addEventListener("keydown",function(e){if(e.key==="ArrowRight"){e.preventDefault();turn(1)}else if(e.key==="ArrowLeft"){e.preventDefault();turn(-1)}});
  document.getElementById("bookTitle").addEventListener("click",function(){if(!busy){s=0;show()}});   // the title in the list: back to the cover
  show();
})();
</script>
