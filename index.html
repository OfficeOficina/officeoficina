<body>
<main class="stage">
  <!-- the words live on the page; every word can be dragged. The card sits on top and covers them. -->
  <div class="under">

    <span class="w l">is</span><span class="w r">a</span>
    <span class="w l">collaborative</span><span class="w r">office</span>
    <span class="w l">of</span><span class="w r">design</span>
    <span class="w l">based</span><span class="w r">in</span>
    <span class="w l">Austin TX</span><span class="w r">USA</span>
    <span class="w l">Mexico City</span><span class="w r">CDMX</span>
    <a class="ic l" href="contact.html" aria-label="contact-form">
      <svg viewBox="0 0 26 20" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><rect x="1" y="1" width="24" height="18"/><path d="M1 1l12 10L25 1M1 19l9-9M25 19l-9-9"/></svg>
    </a>
    <a class="ic r" href="https://www.instagram.com/officeoficina/" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="2" width="20" height="20" rx="6"/><circle cx="12" cy="12" r="4.6"/><circle cx="17.6" cy="6.4" r="1" fill="currentColor" stroke="none"/></svg>
    </a>
    <span class="w l">Lucas</span><span class="w r">Strzelec</span>
    <span class="w l">Maarten</span><span class="w r">Janssens</span>
  </div>

  <div class="logo" aria-label="Office Oficina logo">
    <span class="m dot"></span><span class="m dot"></span>
    <span class="m tri"><svg viewBox="0 0 39 37" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0L39 14.5V22.5L0 37Z"/></svg></span>
  </div>

  <div class="card" id="card" tabindex="0" role="group" aria-label="Business card. Drag it, or use the arrow keys, to move it and reveal the text underneath. Fit the three logo shapes into its letters to unlock it.">
    <svg viewBox="0 0 525 920" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <!-- the cut-out letters (solid O, Helvetica-style bold) -->
        <g id="letters" transform="translate(265 460) rotate(90)">
          <path d="M-278.7 -29.37Q-266.38 -29.37 -258.81 -21.06Q-251.24 -12.75 -251.24 0.82Q-251.24 13.46 -258.69 21.84Q-266.14 30.23 -278.62 30.23Q-291.02 30.23 -298.51 21.88Q-306 13.53 -306 0.43Q-306 -12.68 -298.47 -21.02Q-290.95 -29.37 -278.7 -29.37Z M-234.48 3.94V28.43H-246.18V-28.43H-206.25V-18.68H-234.48V-5.81H-209.6V3.94Z M-189.49 3.94V28.43H-201.19V-28.43H-161.25V-18.68H-189.49V-5.81H-164.61V3.94Z M-144.49 -28.43V28.43H-156.19V-28.43Z M-100.82 -9.16Q-103.01 -19.38 -112.99 -19.38Q-119.93 -19.38 -123.83 -14.08Q-127.73 -8.78 -127.73 0.66Q-127.73 9.95 -123.95 15.17Q-120.17 20.4 -113.38 20.4Q-107.92 20.4 -104.64 17.43Q-101.37 14.47 -100.82 9.01H-89.43Q-89.98 18.76 -96.53 24.49Q-103.08 30.23 -113.69 30.23Q-125.55 30.23 -132.49 22.23Q-139.43 14.24 -139.43 0.51Q-139.43 -13.3 -132.41 -21.33Q-125.39 -29.37 -113.38 -29.37Q-103.32 -29.37 -96.88 -23.98Q-90.45 -18.6 -89.67 -9.16Z M-72.67 3.94V18.68H-41.86V28.43H-84.37V-28.43H-43.27V-18.68H-72.67V-5.81H-45.45V3.94Z"/>
          <path d="M35.44 -29.37Q47.76 -29.37 55.33 -21.06Q62.89 -12.75 62.89 0.82Q62.89 13.46 55.44 21.84Q47.99 30.23 35.51 30.23Q23.11 30.23 15.62 21.88Q8.14 13.53 8.14 0.43Q8.14 -12.68 15.66 -21.02Q23.19 -29.37 35.44 -29.37Z M79.65 3.94V28.43H67.95V-28.43H107.89V-18.68H79.65V-5.81H104.53V3.94Z M124.65 -28.43V28.43H112.95V-28.43Z M168.32 -9.16Q166.13 -19.38 156.15 -19.38Q149.21 -19.38 145.31 -14.08Q141.41 -8.78 141.41 0.66Q141.41 9.95 145.19 15.17Q148.97 20.4 155.76 20.4Q161.22 20.4 164.5 17.43Q167.77 14.47 168.32 9.01H179.71Q179.16 18.76 172.61 24.49Q166.06 30.23 155.45 30.23Q143.59 30.23 136.65 22.23Q129.71 14.24 129.71 0.51Q129.71 -13.3 136.73 -21.33Q143.75 -29.37 155.76 -29.37Q165.82 -29.37 172.26 -23.98Q178.69 -18.6 179.47 -9.16Z M196.47 -28.43V28.43H184.77V-28.43Z M239.2 28.43 216.35 -10.88V28.43H204.65V-28.43H216.66L239.2 10.26V-28.43H250.9V28.43Z M290.67 16.97H269.38L265.55 28.43H253.62L273.82 -28.43H286.77L306.43 28.43H294.41ZM287.47 7.21 280.06 -15.01 272.65 7.21Z"/>
        </g>
        <mask id="cut"><rect width="525" height="920" fill="#fff"/><use href="#letters" fill="#000"/></mask>
        <mask id="cutWide" maskUnits="userSpaceOnUse" x="-120" y="-120" width="765" height="1160"><rect x="-120" y="-120" width="765" height="1160" fill="#fff"/><use href="#letters" fill="#000"/></mask>
        <mask id="holes"><rect width="525" height="920" fill="#000"/><use href="#letters" fill="#fff"/></mask>
        <filter id="lift" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
        <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="2" dy="-3" stdDeviation="5" flood-color="#000" flood-opacity=".2"/></filter>
      </defs>
      <!-- soft, faint shadow: the card looks lifted off the page (kept out of the letters) -->
      <g mask="url(#cutWide)"><rect width="525" height="920" fill="#000" fill-opacity=".11" filter="url(#lift)" transform="translate(3 15)"/></g>
      <!-- gentle inner shading of the letters -->
      <g mask="url(#holes)"><g filter="url(#emboss)"><rect width="525" height="920" fill="#fff" mask="url(#cut)"/></g></g>
      <!-- the card -->
      <rect width="525" height="920" fill="#fff" mask="url(#cut)"/>
    </svg>
    <svg class="plugs" viewBox="0 0 525 920" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g transform="translate(265 460) rotate(90)" fill="#000">
        <path class="plug" data-k="o" d="M-278.7 -29.37Q-266.38 -29.37 -258.81 -21.06Q-251.24 -12.75 -251.24 0.82Q-251.24 13.46 -258.69 21.84Q-266.14 30.23 -278.62 30.23Q-291.02 30.23 -298.51 21.88Q-306 13.53 -306 0.43Q-306 -12.68 -298.47 -21.02Q-290.95 -29.37 -278.7 -29.37Z"/>
        <path class="plug" data-k="o" d="M35.44 -29.37Q47.76 -29.37 55.33 -21.06Q62.89 -12.75 62.89 0.82Q62.89 13.46 55.44 21.84Q47.99 30.23 35.51 30.23Q23.11 30.23 15.62 21.88Q8.14 13.53 8.14 0.43Q8.14 -12.68 15.66 -21.02Q23.19 -29.37 35.44 -29.37Z"/>
        <path class="plug" data-k="a" d="M253.62 28.43L306.43 28.43L286.77 -28.43L273.82 -28.43Z"/>
      </g>
    </svg>
  </div>
</main>
<script>
(function(){
  /* ---- the card ---- */
  var card=document.getElementById("card"),x=0,y=0,tilt=1.8,drag=null,sx=0,sy=0,sr=0,unlocked=false;
  function apply(){
    var lx=innerWidth/2,ly=innerHeight/2;
    x=Math.max(-lx,Math.min(lx,x)); y=Math.max(-ly,Math.min(ly,y));
    card.style.transform="translate("+(x+sx)+"px,"+(y+sy)+"px) rotate("+(tilt+sr)+"deg)";
  }
  apply();
  card.addEventListener("pointerdown",function(e){
    e.preventDefault(); card.focus({preventScroll:true});
    drag={px:e.clientX,py:e.clientY,x:x,y:y,moved:false};
    card.setPointerCapture(e.pointerId); card.classList.add("dragging");
  });
  card.addEventListener("pointermove",function(e){
    if(!drag) return;
    if(!drag.moved){ if(Math.hypot(e.clientX-drag.px,e.clientY-drag.py)<5) return; drag.moved=true; }   // a click never nudges the card
    x=drag.x+(e.clientX-drag.px); y=drag.y+(e.clientY-drag.py);
    apply();
  });
  function end(){ var was=drag; drag=null; card.classList.remove("dragging"); if(was&&!was.moved&&unlocked) location.href="work.html"; }
  card.addEventListener("pointerup",end);
  card.addEventListener("pointercancel",end);
  card.addEventListener("keydown",function(e){
    var s=e.shiftKey?60:20,k=e.key;
    if((k==="Enter"||k===" ")&&unlocked){e.preventDefault();location.href="work.html";return}
    if(k==="ArrowLeft")x-=s; else if(k==="ArrowRight")x+=s;
    else if(k==="ArrowUp")y-=s; else if(k==="ArrowDown")y+=s; else return;
    e.preventDefault(); apply();
  });
  addEventListener("resize",apply);

  /* ---- every word ---- */
  var top=1;
  Array.prototype.forEach.call(document.querySelectorAll(".w,.m"),function(w){
    var wx=0,wy=0,d=null;
    w.addEventListener("pointerdown",function(e){
      e.preventDefault();
      d={px:e.clientX,py:e.clientY,x:wx,y:wy};
      w.setPointerCapture(e.pointerId); w.classList.add("dragging"); w.style.zIndex=++top;
    });
    w.addEventListener("pointermove",function(e){
      if(!d) return;
      var ox=wx,oy=wy;
      wx=d.x+(e.clientX-d.px); wy=d.y+(e.clientY-d.py);
      w.style.transform="translate("+wx+"px,"+wy+"px)";
      var r=w.getBoundingClientRect();           // keep the word on screen
      if(r.right<16||r.left>innerWidth-16||r.bottom<16||r.top>innerHeight-16){
        wx=ox; wy=oy; w.style.transform="translate("+wx+"px,"+wy+"px)";
      }
    });
    function up(){ var was=d; d=null; w.classList.remove("dragging"); if(was&&w.classList.contains("m")) dropCheck(w); }
    w.addEventListener("pointerup",up);
    w.addEventListener("pointercancel",up);
  });

  /* ---- the logo shapes fit into the card's letters: O into OFFICE's O, O into OFICINA's O, A into OFICINA's A ---- */
  var stage=document.querySelector(".stage"),plugs=[].slice.call(document.querySelectorAll(".plug")),still=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function tween(ms,step,done){
    if(still){step(1);if(done)done();return}
    var t0=null;(function f(t){if(t0===null)t0=t;var p=Math.min(1,(t-t0)/ms);step(p);p<1?requestAnimationFrame(f):(done&&done())})(performance.now())
  }
  function ctr(el){var r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,w:r.width,h:r.height}}
  function dropCheck(piece){
    var isTri=piece.classList.contains("tri"),c=ctr(piece),best=null,bd=1e9;
    plugs.forEach(function(p){
      if(p.taken||(p.getAttribute("data-k")==="a")!==isTri) return;
      var b=ctr(p),d=Math.hypot(b.x-c.x,b.y-c.y),lim=Math.max(48,Math.max(b.w,b.h)*.9);
      if(d<lim&&d<bd){bd=d;best=p}
    });
    if(best) fit(piece,best);
  }
  function fit(piece,plug){
    plug.taken=true;
    var r=piece.getBoundingClientRect(),fly=piece.cloneNode(true),isTri=piece.classList.contains("tri"),
        pw=piece.offsetWidth,ph=piece.offsetHeight,bb=plug.getBBox(),k=card.offsetWidth/525,
        sc=(bb.height*k)/pw,x0=r.left+r.width/2,y0=r.top+r.height/2;
    fly.className="fly "+(isTri?"tri":"dot");fly.style.cssText="width:"+pw+"px;height:"+ph+"px";
    stage.appendChild(fly);piece.style.visibility="hidden";
    tween(420,function(p){
      var e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,t=ctr(plug),
          cx=x0+(t.x-x0)*e,cy=y0+(t.y-y0)*e,s=1+(sc-1)*e;
      fly.style.transform="translate("+(cx-pw/2)+"px,"+(cy-ph/2)+"px) rotate("+(tilt*e)+"deg) scale("+s+")";
    },function(){
      plug.classList.add("on");fly.remove();
      if(plugs.every(function(p){return p.classList.contains("on")})) solved();
    });
  }
  function solved(){
    unlocked=true;card.classList.add("open");
    card.setAttribute("aria-label","Business card. Click it to open Work.");
    tween(1000,function(p){                       // the little shutter
      var a=(1-p)*(1-p);
      sx=Math.sin(p*Math.PI*2*11)*7*a;sy=Math.sin(p*Math.PI*2*14+1)*3*a;sr=Math.sin(p*Math.PI*2*12)*.9*a;
      apply();
    },function(){sx=sy=sr=0;apply()});
  }
})();
</script>
</body>
</html>
