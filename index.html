    <svg viewBox="0 0 525 920" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

        <g id="letters" transform="translate(265 460) rotate(90)">
          <path d="M-278.7 -29.37Q-266.38 -29.37 -258.81 -21.06Q-251.24 -12.75 -251.24 0.82Q-251.24 13.46 -258.69 21.84Q-266.14 30.23 -278.62 30.23Q-291.02 30.23 -298.51 21.88Q-306 13.53 -306 0.43Q-306 -12.68 -298.47 -21.02Q-290.95 -29.37 -278.7 -29.37Z M-234.48 3.94V28.43H-246.18V-28.43H-206.25V-18.68H-234.48V-5.81H-209.6V3.94Z M-189.49 3.94V28.43H-201.19V-28.43H-161.25V-18.68H-189.49V-5.81H-164.61V3.94Z M-144.49 -28.43V28.43H-156.19V-28.43Z M-100.82 -9.16Q-103.01 -19.38 -112.99 -19.38Q-119.93 -19.38 -123.83 -14.08Q-127.73 -8.78 -127.73 0.66Q-127.73 9.95 -123.95 15.17Q-120.17 20.4 -113.38 20.4Q-107.92 20.4 -104.64 17.43Q-101.37 14.47 -100.82 9.01H-89.43Q-89.98 18.76 -96.53 24.49Q-103.08 30.23 -113.69 30.23Q-125.55 30.23 -132.49 22.23Q-139.43 14.24 -139.43 0.51Q-139.43 -13.3 -132.41 -21.33Q-125.39 -29.37 -113.38 -29.37Q-103.32 -29.37 -96.88 -23.98Q-90.45 -18.6 -89.67 -9.16Z M-72.67 3.94V18.68H-41.86V28.43H-84.37V-28.43H-43.27V-18.68H-72.67V-5.81H-45.45V3.94Z"/>
          <path d="M35.44 -29.37Q47.76 -29.37 55.33 -21.06Q62.89 -12.75 62.89 0.82Q62.89 13.46 55.44 21.84Q47.99 30.23 35.51 30.23Q23.11 30.23 15.62 21.88Q8.14 13.53 8.14 0.43Q8.14 -12.68 15.66 -21.02Q23.19 -29.37 35.44 -29.37Z M79.65 3.94V28.43H67.95V-28.43H107.89V-18.68H79.65V-5.81H104.53V3.94Z M124.65 -28.43V28.43H112.95V-28.43Z M168.32 -9.16Q166.13 -19.38 156.15 -19.38Q149.21 -19.38 145.31 -14.08Q141.41 -8.78 141.41 0.66Q141.41 9.95 145.19 15.17Q148.97 20.4 155.76 20.4Q161.22 20.4 164.5 17.43Q167.77 14.47 168.32 9.01H179.71Q179.16 18.76 172.61 24.49Q166.06 30.23 155.45 30.23Q143.59 30.23 136.65 22.23Q129.71 14.24 129.71 0.51Q129.71 -13.3 136.73 -21.33Q143.75 -29.37 155.76 -29.37Q165.82 -29.37 172.26 -23.98Q178.69 -18.6 179.47 -9.16Z M196.47 -28.43V28.43H184.77V-28.43Z M239.2 28.43 216.35 -10.88V28.43H204.65V-28.43H216.66L239.2 10.26V-28.43H250.9V28.43Z M290.67 16.97H269.38L265.55 28.43H253.62L273.82 -28.43H286.77L306.43 28.43H294.41ZM287.47 7.21 280.06 -15.01 272.65 7.21Z"/>
        </g>
        <mask id="cut"><rect width="525" height="920" fill="#fff"/><use href="#letters" fill="#000"/></mask>

<div class="doom" id="doom" role="alert" hidden><p>dang<br>you<br>stupid</p></div>
<script>
(function(){
  /* ---- the card ---- */
  var card=document.getElementById("card"),x=0,y=0,tilt=1.8,drag=null;
  function apply(){
    var lx=innerWidth/2,ly=innerHeight/2;
    x=Math.max(-lx,Math.min(lx,x)); y=Math.max(-ly,Math.min(ly,y));
    card.style.transform="translate("+x+"px,"+y+"px) rotate("+tilt+"deg)";
  }
  apply();
  card.addEventListener("pointerdown",function(e){
    e.preventDefault(); card.focus({preventScroll:true});
    drag={px:e.clientX,py:e.clientY,x:x,y:y};
    card.setPointerCapture(e.pointerId); card.classList.add("dragging");
  });
  card.addEventListener("pointermove",function(e){
    if(!drag) return;
    x=drag.x+(e.clientX-drag.px); y=drag.y+(e.clientY-drag.py);
    apply();
  });
  function end(){ drag=null; card.classList.remove("dragging"); }
  card.addEventListener("pointerup",end);
  card.addEventListener("pointercancel",end);
  card.addEventListener("keydown",function(e){
    var s=e.shiftKey?60:20,k=e.key;
    if(k==="ArrowLeft")x-=s; else if(k==="ArrowRight")x+=s;
    else if(k==="ArrowUp")y-=s; else if(k==="ArrowDown")y+=s; else return;
    e.preventDefault(); apply();
  });
  addEventListener("resize",apply);

  /* ---- every word ---- */
  var top=1;
  Array.prototype.forEach.call(document.querySelectorAll(".w,.m"),function(w){
    var wx=0,wy=0,d=null;
    w.addEventListener("pointerdown",function(e){
      e.preventDefault();
      d={px:e.clientX,py:e.clientY,x:wx,y:wy};
      w.setPointerCapture(e.pointerId); w.classList.add("dragging"); w.style.zIndex=++top;
    });
    w.addEventListener("pointermove",function(e){
      if(!d) return;
      var ox=wx,oy=wy;
      wx=d.x+(e.clientX-d.px); wy=d.y+(e.clientY-d.py);
      w.style.transform="translate("+wx+"px,"+wy+"px)";
      if(w.classList.contains("m")) hoverHole(w);
      var r=w.getBoundingClientRect();           // keep the word on screen
      if(r.right<16||r.left>innerWidth-16||r.bottom<16||r.top>innerHeight-16){
        wx=ox; wy=oy; w.style.transform="translate("+wx+"px,"+wy+"px)";
      }
    });
    function up(){ var was=d; d=null; w.classList.remove("dragging"); if(was&&w.classList.contains("m")) dropCheck(w); }
    w.addEventListener("pointerup",up);
    w.addEventListener("pointercancel",up);
  });

  /* ---- holes: drop a logo shape into the top hole; it comes out of the bottom hole and rolls into WORK ---- */
  var holeA=document.getElementById("holeA"),holeB=document.getElementById("holeB"),
      socketEl=document.getElementById("socket"),workEl=document.getElementById("work"),workLink=document.getElementById("workLink"),RED="#ee2a1e",
      stage=document.querySelector(".stage"),TAU=Math.PI*2,socketBall=null,extras=[],still=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function ctr(el){var r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,w:r.width,h:r.height}}
  function geo(){
    var s=ctr(socketEl),wr=workEl.getBoundingClientRect(),dot=document.querySelector(".logo .dot"),dw=dot.offsetWidth||1;
    return{ox:s.x,oy:s.y,ow:s.w,wl:wr.left,S:s.w/dw,dh:dot.offsetHeight};
  }
  function layoutHoles(){var g=geo();holeB.style.top=(g.oy-holeB.offsetHeight/2)+"px"}
  function inHole(el){var a=ctr(holeA),c=ctr(el);return Math.hypot(a.x-c.x,a.y-c.y)<a.w*.6}
  function hoverHole(el){holeA.classList.toggle("over",inHole(el))}
  function render(b){b.style.transform="translate("+(b.x-b.w/2)+"px,"+(b.y-b.h/2)+"px) rotate("+b.a+"rad) scale("+b.sc+")"}
  function tween(ms,step,done){
    if(still){step(1);if(done)done();return}
    var t0=null;(function f(t){if(t0===null)t0=t;var p=Math.min(1,(t-t0)/ms);step(p);p<1?requestAnimationFrame(f):(done&&done())})(performance.now())
  }
  function setWorkActive(on){workLink.classList.toggle("on",on);workLink.tabIndex=on?0:-1;workLink.setAttribute("aria-disabled",on?"false":"true")}
  function paint(b,c){if(b.classList.contains("tri"))b.style.color=c;else b.style.background=c}
  function release(b){
    if(socketBall===b){socketBall=null;setWorkActive(false)}
    var i=extras.indexOf(b);if(i>-1)extras.splice(i,1);
    b.slot=null;
  }
  function makeBall(piece){
    var r=piece.getBoundingClientRect(),b=piece.cloneNode(true),tri=piece.classList.contains("tri");
    b.className="ball "+(tri?"tri":"dot");
    b.style.cssText="width:"+piece.offsetWidth+"px;height:"+piece.offsetHeight+"px";
    b.w=piece.offsetWidth;b.h=piece.offsetHeight;b.x=r.left+r.width/2;b.y=r.top+r.height/2;b.a=0;b.sc=1;b.busy=false;
    render(b);stage.appendChild(b);piece.style.visibility="hidden";ballDrag(b);return b;
  }
  function dropCheck(piece){if(inHole(piece)){holeA.classList.remove("over");var b=makeBall(piece);flight(b)}}
  function ballDrag(b){
    var d=null,lifted=false;
    b.addEventListener("pointerdown",function(e){
      if(b.busy)return;e.preventDefault();lifted=false;
      d={px:e.clientX,py:e.clientY,x:b.x,y:b.y};b.setPointerCapture(e.pointerId);
    });
    b.addEventListener("pointermove",function(e){
      if(!d)return;
      if(!lifted){if(Math.hypot(e.clientX-d.px,e.clientY-d.py)<5)return;lifted=true;release(b);b.classList.add("dragging");b.style.zIndex=5}
      b.x=Math.max(8,Math.min(innerWidth-8,d.x+e.clientX-d.px));b.y=Math.max(8,Math.min(innerHeight-8,d.y+e.clientY-d.py));
      render(b);hoverHole(b);
    });
    function up(){
      if(!d)return;var was=lifted;d=null;lifted=false;
      if(!was){if(b.slot==="O")location.href="work.html";return}      // a click, not a drag
      b.classList.remove("dragging");b.style.zIndex=4;holeA.classList.remove("over");if(inHole(b))flight(b);
    }
    b.addEventListener("pointerup",up);b.addEventListener("pointercancel",up);
  }
  /* 1. shrink into the top hole  2. pause  3. pop out of the bottom hole  4. roll to WORK */
  function flight(b){
    b.busy=true;release(b);
    var A=ctr(holeA),x0=b.x,y0=b.y,s0=b.sc;
    tween(340,function(p){var e=p*p;b.x=x0+(A.x-x0)*e;b.y=y0+(A.y-y0)*e;b.sc=s0*(1-e);render(b)},function(){
      b.style.visibility="hidden";
      setTimeout(function(){b.style.visibility="";emerge(b)},still?0:500);
    });
  }
  function queueEdge(g,skip){var e=g.wl-10;extras.forEach(function(x){if(x!==skip)e=Math.min(e,x.tx-x.w*g.S/2-6)});return e}
  function restY(b,g){return b.slot==="O"?g.oy:g.oy+(g.dh-b.h)*g.S/2}     // shapes rest on the same floor
  function target(b,g){
    var w=b.w*g.S;
    if(!socketBall){socketBall=b;b.slot="O";b.tx=g.ox;return g.ox}
    b.slot="Q";b.tx=queueEdge(g,b)-w/2;extras.push(b);
    return b.tx;
  }
  function emerge(b){
    var g=geo(),B=ctr(holeB),S=g.S,rr=Math.max(b.w,b.h)*S/2,tx=target(b,g),floor=restY(b,g),
        x1=B.x+30,L=Math.max(0,tx-x1),T=Math.max(1.3,L/430)*1000,pop=b.h*S*.8;
    b.y=floor;b.x=B.x;b.a=0;
    tween(460,function(p){
      var e=1-Math.pow(1-p,3);b.sc=S*e;b.x=B.x+30*p;b.y=floor-pop*4*p*(1-p)*(1-.3*p);render(b);
    },function(){
      var aEnd=L/rr,aTarget=Math.round(aEnd/TAU)*TAU;
      tween(T,function(p){
        var q=2*p-p*p;b.x=x1+L*q;b.y=floor;b.sc=S;
        b.a=(L*q)/rr+(aTarget-aEnd)*Math.pow(p,4);render(b);
      },function(){b.busy=false;b.x=tx;b.a=aTarget;render(b);if(b.slot==="O"){paint(b,"#000");setWorkActive(true)}else paint(b,RED)});
    });
  }
  function relayout(){
    layoutHoles();var g=geo();
    if(socketBall&&!socketBall.busy){socketBall.sc=g.S;socketBall.x=socketBall.tx=g.ox;socketBall.y=restY(socketBall,g);render(socketBall)}
    var edge=g.wl-10;
    extras.forEach(function(b){var w=b.w*g.S;b.tx=edge-w/2;edge-=w+6;if(b.busy)return;b.sc=g.S;b.x=b.tx;b.y=restY(b,g);render(b)});
  }
  layoutHoles();
  addEventListener("resize",relayout);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layoutHoles);

  /* ---- one minute to reach WORK, or else ---- */
  var LIMIT=60000,t0=Date.now(),timerEl=document.getElementById("timer"),doomEl=document.getElementById("doom"),iv=null;
  function tick(){
    var left=Math.max(0,LIMIT-(Date.now()-t0)),sec=Math.ceil(left/1000);
    timerEl.textContent=Math.floor(sec/60)+":"+("0"+sec%60).slice(-2);
    if(left<=0){clearInterval(iv);doomEl.hidden=false}
  }
  function startTimer(){clearInterval(iv);t0=Date.now();doomEl.hidden=true;tick();iv=setInterval(tick,200)}
  startTimer();
  addEventListener("pageshow",function(e){if(e.persisted)startTimer()});   // coming back with the Back button = fresh minute
})();
</script>
