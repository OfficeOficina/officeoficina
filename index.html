  <!-- index: opened by "index". The icons go, the words stay until you scroll; then only the text scrolls up and away,
       the title line (text, building, furniture, text) locks at the top, and the projects scroll forever underneath.
       The projects themselves are listed in the script near the bottom of this file (look for BUILDINGS and FURNITURE). -->
  <section class="index" id="index" aria-label="Index">
    <div class="ixhead" aria-hidden="true"><span>Text</span><span>Building</span><span>Furniture</span><span>Text</span></div>
    <div class="ixcols" id="ixcols"><div class="ixc"></div><div class="ixc"></div><div class="ixc"></div><div class="ixc"></div></div>
    <!-- one project, opened by clicking its drawings (or title): its text on the left, one image at a time on the right -->
    <div class="pview" id="pview" aria-live="polite">
      <div class="pv-text"><b></b><span class="pv-meta"></span><p></p></div>
      <div class="pv-img"><img alt=""><span class="pv-count"></span></div>
    </div>
  </section>
  </div>
  <!-- grid: opened by "grid". Squares with a fine dashed outline, 4 across on a computer, 1 on a phone.
       The squares are listed in the script (look for GRID). -->
  <section class="gridv" id="gridv" aria-label="Grid" aria-hidden="true"><div class="gsq" id="gsq"></div></section>
  <div class="sbar" aria-hidden="true"></div>

  <!-- write to us: opened by the mail icon. The message takes the OFFICE side, the drawing pad the OFICINA side. -->
  <div class="mailbox" id="mailbox" aria-hidden="true">
    <div class="contact mailL">
    <!-- Messages and drawings are emailed to lucasjstrzelec@gmail.com through FormSubmit.
         To hide the address, replace it in the action below with the random code FormSubmit gives you after activation. -->
    <form id="mailForm" action="https://formsubmit.co/lucasjstrzelec@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="New message from the Office Oficina website">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="box">
      <input type="text" name="_honey" value="" tabindex="-1" autocomplete="off" style="display:none">
      <div class="fields" id="fields">
        <label>Name <input name="name" required autocomplete="name"></label>
        <label>Email <input name="email" type="email" required autocomplete="email"></label>
        <label>Message <textarea name="message" required></textarea></label>
      </div>
      <div class="sendrow">
        <button type="submit" id="mailSend">Send</button>
        <span id="mailStatus" role="status"></span>
      </div>
    </form>
    </div>
    <div class="contact mailR">
    <!-- drawing pad: same size as the message form, draw inside the dashed line -->
    <div class="padwrap">
      <div class="padtools" role="toolbar" aria-label="Drawing tools">
        <div class="padtop">
          <button class="padtool on" id="padTool" type="button" aria-pressed="true" aria-label="Pencil"><img src="pencil.png" alt=""></button>
          <button class="padundo" id="padUndo" type="button" aria-label="Go back (erase the last line)" title="Go back" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>
          </button>
        </div>
        <div class="padcolors" role="group" aria-label="Colours">
          <span class="wheelwrap"><button class="padsw wheelsw sel" type="button" data-c="#000000" style="--c:#000000" aria-label="Colour: open the colour wheel" aria-expanded="false"></button><span class="wheelpop" hidden><span class="wheelgrip" title="Drag to move"></span><span class="wheelarea"><canvas width="320" height="320" aria-label="Colour wheel: click or drag to pick a colour"></canvas><i class="wheelmark"></i></span><input class="wheelv" type="range" min="0" max="100" value="0" aria-label="Light to dark"></span></span>
        </div>
        <div class="padsize"><input id="padSize" type="range" min="1" max="24" value="3" aria-label="Thickness"></div>
      </div>
      <div class="pad" id="pad"><canvas id="padCanvas" aria-label="Drawing pad"></canvas></div>
    </div>
    <div class="padsend">
      <button type="button" id="padSend">Send</button>
      <span id="padStatus" role="status"></span>
    </div>
    </div>
  </div>

  <!-- about: the flip book opens here, in place of the text; the card and the logo stay -->
  <div class="aboutbook" id="about" aria-hidden="true">
    <div class="spread" id="spread"></div>
    <div class="bookctl">
      <button type="button" id="mix">Mix</button>
      <button type="button" class="x" id="closeAbout" aria-label="Close" hidden>&times;</button>
    </div>
  </div>

<script>
(function(){
  /* ---- the card ---- */
  var card=document.getElementById("card"),flip=0,x=0,y=0,tilt=1.8,rot=0,drag=null,sx=0,sy=0,sr=0,unlocked=false;
  function apply(){
    var lx=innerWidth/2,ly=innerHeight/2;
    x=Math.max(-lx,Math.min(lx,x)); y=Math.max(-ly,Math.min(ly,y));
    card.style.transform="perspective(1600px) translate("+(x+sx)+"px,"+(y+sy)+"px) rotate("+(tilt+rot+sr)+"deg) rotateY("+flip+"deg)";
    light();
  }
  apply();
  card.addEventListener("pointerdown",function(e){
    e.preventDefault(); card.focus({preventScroll:true});
    drag={px:e.clientX,py:e.clientY,x:x,y:y,moved:false};
    card.setPointerCapture(e.pointerId); card.classList.add("dragging");
  });
  card.addEventListener("pointermove",function(e){
    if(!drag) return;
    if(!drag.moved){ if(Math.hypot(e.clientX-drag.px,e.clientY-drag.py)<5) return; drag.moved=true; }   // a click never nudges the card
    x=drag.x+(e.clientX-drag.px); y=drag.y+(e.clientY-drag.py);
    apply();
  });
  function end(e){ var was=drag; drag=null; card.classList.remove("dragging");
    if(was&&was.moved&&nearSlit()){post();return}
    if(was&&!was.moved&&e.type==="pointerup")goHome();   // a click on the card (without dragging it) brings you back to the start
  }
  card.addEventListener("pointerup",end);
  card.addEventListener("pointercancel",end);
  card.addEventListener("keydown",function(e){
    var s=e.shiftKey?60:20,k=e.key;
    if(k==="ArrowLeft")x-=s; else if(k==="ArrowRight")x+=s;
    else if(k==="ArrowUp")y-=s; else if(k==="ArrowDown")y+=s; else return;
    e.preventDefault(); apply();
  });
  addEventListener("resize",apply);

  /* ---- the slit (top centre, as wide as the card): drop the card on it and it slips in and disappears; click the slit and it comes back out ---- */
  var slit=document.getElementById("slit"),posted=false,busyS=false;
  function nearSlit(){                                    // is the card over, or close to, the slit? (generous, so it is easy to post)
    var c=card.getBoundingClientRect(),s=slit.getBoundingClientRect(),pad=40;
    return c.left<s.right+pad&&c.right>s.left-pad&&c.top<s.bottom+pad&&c.bottom>s.top-pad;
  }
  function restC(){var t=card.style.transform;card.style.transform="none";var r=card.getBoundingClientRect();card.style.transform=t;return{x:r.left+r.width/2,y:r.top+r.height/2}}
  function slitPlan(){                                    // where the card lines up under the slit, shrunk to fit through it
    var b=restC(),s=slit.getBoundingClientRect(),cw=card.offsetWidth,ch=card.offsetHeight,sc=Math.min(1,s.width/cw);
    return{sc:sc,ch:ch,x:s.left+s.width/2-b.x,y:s.top+s.height/2+ch*sc/2-b.y};
  }
  function put(t,cut){card.style.transform="perspective(1600px) translate("+t.x+"px,"+t.y+"px) rotate("+t.r+"deg) scale("+t.s+") rotateY("+flip+"deg)";card.style.clipPath=cut>0?"inset("+cut+"px 0 0 0)":""}
  function mix(a,b,e){return{x:a.x+(b.x-a.x)*e,y:a.y+(b.y-a.y)*e,r:a.r+(b.r-a.r)*e,s:a.s+(b.s-a.s)*e}}

      text:["Torre is a conceptual residential high rise developed after a trip to Mexico City, where upon returning home we were immediately put into self isolation due to the Covid Pandemic. It is an exploration of the experiences and diverse conditions we admired in Mexico City, a collaborative project focused on the architectural plan. We created a neutral frame, built out from the geometries of an abandoned warehouse block, to fill with these established diverse conditions. We tried as many conditions as we could go through, theorizing that individuals living in this “exquisite corpse” would potentially design and build each floor to whatever situations they needed.", "Starting with a list of architectural situations and 35mm photographs we took on our trip, we experimented and explored these theories through an architectural language. Sometimes one partner would start a plan and the other would finish; sometimes one partner would take up half of a floor and identify where the other could begin with their interpretation of a theory (or a symbiotic theory), implying a reaction to what had already been designed; and sometimes a mixed authorship would evolve from one partner responding to continuous on-screen annotation by the other. Occasionally the plans were playful, other times the plans were serious, speaking to our dynamic reactions to the situation. The result is an exploration of isolated collaboration, a building that is grounded by our experiences in Mexico City, and elevated by our desire to find again the energy of studio through a remote process."]}},

    addEventListener("keydown",function(e){if(e.key==="Escape"&&st){e.stopImmediatePropagation();putAway()}},true);
    addEventListener("pageshow",function(){document.documentElement.classList.remove("leaving");[].forEach.call(document.querySelectorAll(".vinyl,.sleeve"),function(v){v.remove()});st=null;drag=null});
  })();

  /* ---- the mirrored A of the logo: one step back (north wall -> plan -> start; a project -> the index; the grid -> the index; ...) ---- */
  function goBack(){
    var st=document.querySelector(".stage"),lv=document.getElementById("loungev");

    var open=st.classList.contains("lounging")||st.classList.contains("indexed")||st.classList.contains("mailing")||document.getElementById("about").classList.contains("on");

  }
  window.goBack=goBack;

    Array.prototype.forEach.call(document.querySelectorAll(".m.mir"),function(m){m.classList.remove("mir")});   // the A turns back
    if(window.setIndex&&document.querySelector(".stage").classList.contains("indexed"))setIndex(false);

  /* ---- the logo shapes fit into the card's letters: O into OFFICE's O, O into OFICINA's O, A into OFICINA's A ---- */

          cx=x0+(t.x-x0)*e,cy=y0+(t.y-y0)*e,s=1+(sc-1)*e;

      if(plugs.every(function(p){return p.classList.contains("on")})) solved();

    if(!filled.length){pieces.forEach(function(m){m.dispatchEvent(new Event("resetpos"))});return}
    (function(){var d=pieces.filter(function(m){return m.classList.contains("dot")});    // the shapes that are in the card are not in the corner yet
      filled.forEach(function(p){var m=p.getAttribute("data-k")==="a"?pieces.filter(function(m){return m.classList.contains("tri")})[0]:d.shift();if(m)m.style.visibility="hidden"})})();
    function out(){
      var a0={x:x,y:y,r:rot};                                   // the card glides back to the middle, straight
      tween(600,function(p){var e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;x=a0.x*(1-e);y=a0.y*(1-e);rot=a0.r*(1-e);apply()});
      var dots=pieces.filter(function(m){return m.classList.contains("dot")}),tri=pieces.filter(function(m){return m.classList.contains("tri")})[0],used=[];
      plugs.forEach(function(plug,i){
        if(!(plug.classList.contains("on")||plug.taken))return;

        piece.dispatchEvent(new Event("resetpos"));
        var to=ctr(piece),from=ctr(plug),pw=piece.offsetWidth,ph=piece.offsetHeight,bb=plug.getBBox(),k=card.offsetWidth/525,sc=(bb.height*k)/pw;
        piece.style.visibility="hidden";
        var fly=piece.cloneNode(true);fly.className="fly "+(plug.getAttribute("data-k")==="a"?"tri":"dot");fly.style.cssText="width:"+pw+"px;height:"+ph+"px";stage.appendChild(fly);
        plug.classList.remove("on");plug.taken=false;var l=document.querySelector('.lt[data-p="'+i+'"]');if(l)l.classList.remove("filled");
        tween(700,function(p){var e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,cx=from.x+(to.x-from.x)*e,cy=from.y+(to.y-from.y)*e,s=sc+(1-sc)*e;
          fly.style.transform="translate("+(cx-pw/2)+"px,"+(cy-ph/2)+"px) rotate("+(tilt*(1-e))+"deg) scale("+s+")"},
          function(){piece.style.visibility="";fly.remove()});
      });
      pieces.forEach(function(m){if(used.indexOf(m)<0)m.dispatchEvent(new Event("resetpos"))});
      unlocked=false;card.classList.remove("open","flipped");rotEl.tabIndex=-1;fF.tabIndex=-1;lis.tabIndex=-1;
      card.setAttribute("aria-label","Business card. Drag it, or use the arrow keys, to move it and reveal the text underneath. Fit the three logo shapes into its letters to unlock it.");
    }

  }
  window.resetCard=resetCard;
  function fillLetter(i){var l=document.querySelector('.lt[data-p="'+i+'"]');if(l)l.classList.add("filled")}   // the O / O / A in the text behind the card fills in
  function solved(){
    unlocked=true;card.classList.add("open");rotEl.tabIndex=0;document.getElementById("flipF").tabIndex=0;
    card.setAttribute("aria-label","Business card. Turn it with the arrow in its corner, or flip it over.");
    tween(1000,function(p){                       // the little shutter
      var a=(1-p)*(1-p);
      sx=Math.sin(p*Math.PI*2*11)*7*a;sy=Math.sin(p*Math.PI*2*14+1)*3*a;sr=Math.sin(p*Math.PI*2*12)*.9*a;

    },function(){sx=sy=sr=0;apply()});
  }

  /* ---- press a logo shape: the hole(s) it fits into pulse grey once a second (mouse: while held; touch: +3 s) ---- */
  var hls=[].slice.call(document.querySelectorAll(".hl")),hintTO=null,hintMouse=false;
  function hintOn(piece,ptype){
    clearTimeout(hintTO);hintMouse=(ptype==="mouse");var k=piece.classList.contains("tri")?"a":"o";
    hls.forEach(function(h,i){h.classList.toggle("on",h.getAttribute("data-k")===k&&!plugs[i].taken&&!plugs[i].classList.contains("on"))});

    var r=th*Math.PI/180,c=Math.cos(r),n=Math.sin(r);
    var shT="translate("+(c*3+n*15).toFixed(2)+" "+(-n*3+c*15).toFixed(2)+")";if(shRect)shRect.setAttribute("transform",shT);if(shRectB)shRectB.setAttribute("transform",shT);
    if(emb){emb.setAttribute("dx",(c*2-n*3).toFixed(2));emb.setAttribute("dy",(-n*2-c*3).toFixed(2))}
  }
  /* ---- rotate handle: appears once all three shapes are in; drag it around the card to turn it a full 360 ---- */
  var rotEl=document.getElementById("rot"),rd=null;
  function ang(e){var r=card.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI}
  function rotEnd(){rd=null}
  [rotEl].forEach(function(el){                            // one handle; it moves to the other side with the card
    el.addEventListener("pointerdown",function(e){e.preventDefault();e.stopPropagation();rd={a:ang(e)};el.setPointerCapture(e.pointerId)});
    el.addEventListener("pointermove",function(e){
      if(!rd)return;var a=ang(e),d=a-rd.a;while(d>180)d-=360;while(d<-180)d+=360;

  var flipping=false,fF=document.getElementById("flipF"),lis=document.getElementById("listen");

    e.preventDefault();if(lis.classList.contains("open"))return;lis.classList.add("open");
    setTimeout(function(){lis.classList.remove("open");setLounge(true)},650);   // in to the listening room, on this page
  });

<script>
var PHOTOS = [
  // "about/lucas-1.jpg",
  // "about/lucas-2.jpg",
  // "about/maarten-1.jpg",
  // "about/maarten-2.jpg",
];

/* drawings that replace a strip of one figure. Figure number (0 = L1, 1 = M1, 2 = L2 ...) : its head / body / legs */
var HEADS = {0: "about/lucas-head.jpg"};
var BODIES = {0: "about/lucas-body.svg"};
var LEGS = {0: "about/lucas-legs.svg"};

/* flat black / white blocks that turn up in place of a head, body or legs */
var BLOCKS = ["#000", "#fff", "#000"];

/* colour of the back of every strip of every strip (what you see on the left page) */
var BACKS = ["#000", "#fff"];

(function(){
  /* grey stand-in figures until real photos are added above */
  function stand(i){
    var who=i%2,n=Math.floor(i/2),ink="#000",bg="#fff";
    var hr=30+(n%3)*5,bw=78+((n+who)%3)*14,lg=who?26:22,lx=who?5:0;
    var s="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 500' preserveAspectRatio='none'><rect width='200' height='500' fill='"+bg+"'/>"+
      "<ellipse cx='100' cy='92' rx='"+(hr-4+who*3)+"' ry='"+hr+"' fill='"+ink+"'/>"+
      "<rect x='"+(100-bw/2)+"' y='178' width='"+bw+"' height='148' rx='"+(who?4:14)+"' fill='"+ink+"'/>"+
      "<rect x='"+(72-lx)+"' y='340' width='"+lg+"' height='130' fill='"+ink+"'/><rect x='"+(106+lx-(lg-22))+"' y='340' width='"+lg+"' height='130' fill='"+ink+"'/>"+
      "<rect x='"+(66-lx)+"' y='468' width='"+(lg+10)+"' height='12' rx='5' fill='"+ink+"'/><rect x='"+(100+lx-(lg-22))+"' y='468' width='"+(lg+10)+"' height='12' rx='5' fill='"+ink+"'/>"+
      "<text x='100' y='98' font-family='Arial' font-size='15' fill='"+bg+"' text-anchor='middle'>"+(who?"M":"L")+(n+1)+"</text></svg>";
    return "data:image/svg+xml;utf8,"+encodeURIComponent(s);
  }
  var photos=PHOTOS.length?PHOTOS:[0,1,2,3,4,5,6,7].map(stand);
  photos.forEach(function(src){new Image().src=src});
  [HEADS,BODIES,LEGS].forEach(function(o){Object.keys(o).forEach(function(k){new Image().src=o[k]})});

  /* each strip gets its own shuffled stack: all photos + the colour blocks.
     Page 0 is always the first photo, so the book opens on a whole person. */
  function rng(seed){return function(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
  var stacks=[0,1,2].map(function(p){
    var rest=photos.slice(1).map(function(s,k){return{img:s,parts:[HEADS[k+1],BODIES[k+1],LEGS[k+1]]}}),r=rng(97+p*131);
    for(var i=rest.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=rest[i];rest[i]=rest[j];rest[j]=t}
    var out=[{img:photos[0],parts:[HEADS[0],BODIES[0],LEGS[0]]}],gap=Math.max(2,Math.round(rest.length/BLOCKS.length)),b=0;   // colour blocks spread through the stack
    rest.forEach(function(pg,k){out.push(pg);if((k+1+p)%gap===0&&b<BLOCKS.length)out.push({col:BLOCKS[(b++ +p)%BLOCKS.length]})});
    while(b<BLOCKS.length)out.push({col:BLOCKS[(b++ +p)%BLOCKS.length]});
    return out;
  });
  var N=stacks[0].length,cur=[0,0,0],busy=[false,false,false];
  function back(p,i){i=((i%N)+N)%N;return BACKS[(i+p)%BACKS.length]}
  function paint(el,page,p){
    el.style.backgroundSize=el.style.backgroundPosition="";
    var own=page.img&&page.parts&&page.parts[p];
    if(own&&p===0){el.style.backgroundColor="#fff";el.style.backgroundImage='url("'+own+'")';el.style.backgroundSize="auto 78%";el.style.backgroundPosition="center 60%"}
    else if(own){el.style.backgroundColor="#fff";el.style.backgroundImage='url("'+own+'")';el.style.backgroundSize="contain";el.style.backgroundPosition="center"}
    else if(page.img){el.style.backgroundColor="";el.style.backgroundImage='url("'+page.img+'")'}
    else{el.style.backgroundImage="none";el.style.backgroundColor=page.col}
  }
  function paintCol(el,c){el.style.backgroundImage="none";el.style.backgroundSize=el.style.backgroundPosition="";el.style.backgroundColor=c}

  var spread=document.getElementById("spread"),L=[],R=[];
  [0,1,2].forEach(function(p){
    var l=document.createElement("div"),r=document.createElement("div");
    l.className="cell lp";r.className="cell rp";
    l.setAttribute("data-part",p);r.setAttribute("data-part",p);
    l.style.gridColumn=1;r.style.gridColumn=2;l.style.gridRow=r.style.gridRow=p+1;
    [l,r].forEach(function(c,k){
      c.tabIndex=0;c.setAttribute("role","button");
      c.setAttribute("aria-label",["Head","Body","Legs"][p]+(k?": next":": previous"));
      var pg=document.createElement("div");pg.className="pg";c.appendChild(pg);
      c.addEventListener("click",function(){step(p,k?1:-1)});
      c.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();step(p,k?1:-1)}});
      var x0=null;
      c.addEventListener("touchstart",function(e){x0=e.touches[0].clientX},{passive:true});
      c.addEventListener("touchend",function(e){
        if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;x0=null;
        if(Math.abs(dx)>30){e.preventDefault();step(p,dx<0?1:-1)}
      });
    });
    spread.appendChild(l);spread.appendChild(r);
    paintCol(l.firstChild,back(p,-1));paint(r.firstChild,stacks[p][0],p);
    L[p]=l;R[p]=r;
  });

  function leaf(p,front,backCol,dir){
    var lf=document.createElement("div");lf.className="leaf "+(dir>0?"fwd":"rev");
    var f=document.createElement("div");f.className="pg";paint(f,front,p);
    var b=document.createElement("div");b.className="pg bk";paintCol(b,backCol);

  }
  /* turn strip p to page "to": forward = the right page lifts over the spiral,
     backward = the last page comes back from the left */
  function turnTo(p,to,dir){
    to=((to%N)+N)%N;if(busy[p]||to===cur[p])return;busy[p]=true;
    var from=cur[p],rpg=R[p].firstChild,lpg=L[p].firstChild,lf;
    if(dir>0){
      lf=leaf(p,stacks[p][from],back(p,to-1),1);paint(rpg,stacks[p][to],p);
      lf.addEventListener("animationend",function(){paintCol(lpg,back(p,to-1));lf.remove();busy[p]=false},{once:true});
    }else{
      lf=leaf(p,stacks[p][to],back(p,to),-1);paintCol(lpg,back(p,to-1));
      lf.addEventListener("animationend",function(){paint(rpg,stacks[p][to],p);lf.remove();busy[p]=false},{once:true});
    }
    cur[p]=to;
  }
  function step(p,d){turnTo(p,cur[p]+d,d)}

  /* open / close: the text fades out, the book fades in, same page (#about) */
  var under=document.querySelector(".under"),book=document.getElementById("about");
  function show(on){
    if(on&&window.setIndex)setIndex(false);if(on&&window.setMail)setMail(false);if(on&&window.setGrid)setGrid(false);
    book.classList.toggle("on",on);under.classList.toggle("away",on);book.setAttribute("aria-hidden",on?"false":"true");
  }
  var pushed=false;
  window.openAbout=function(){if(location.hash!=="#about"){pushed=true;location.hash="about"}else show(true)};
  function sync(){show(location.hash==="#about")}
  addEventListener("hashchange",function(){if(location.hash!=="#about")pushed=false;sync()});sync();
  function close(){
    if(location.hash==="#about"&&pushed){pushed=false;history.back()}
    else{if(location.hash)history.replaceState(null,"",location.pathname+location.search);show(false)}
  }
  document.getElementById("closeAbout").addEventListener("click",close);
  addEventListener("keydown",function(e){if(e.key==="Escape"&&book.classList.contains("on"))close()});

  document.getElementById("mix").addEventListener("click",function(){
    [0,1,2].forEach(function(p){
      var t;do{t=Math.floor(Math.random()*N)}while(N>1&&t===cur[p]);
      setTimeout(function(){turnTo(p,t,1)},p*90);
    });
  });
})();
</script>
<script>
/* ---- write to us: the words, icons and "index" give way to two squares - the message on the OFFICE side,
        the drawing on the OFICINA side (on phones: one above the other). Click the logo to go back. ---- */
(function(){
  var stage=document.querySelector(".stage"),box=document.getElementById("mailbox"),ic=document.querySelector('[data-go="contact"]'),
      under=document.querySelector(".under"),L=box.querySelector(".mailL"),R=box.querySelector(".mailR");
  function place(){
    var vw=innerWidth,vh=innerHeight,S;
    if(vw<=700){                                           // phones: stacked, centred, as big as fits
      S=Math.round(Math.min(vw*.86,(vh-250)/2,420));
      for(var k=0;k<2;k++){                                 // size once, measure, and shrink if both squares don't fit on screen
        L.style.width=R.style.width=S+"px";L.style.left=R.style.left=((vw-S)/2)+"px";
        dispatchEvent(new Event("mailboxresize"));
        var over=L.offsetHeight+R.offsetHeight+18-(vh-84);if(over<=0)break;S=Math.max(140,Math.round(S-over/2));
      }
      var top=Math.max(64,(vh-(L.offsetHeight+R.offsetHeight+18))/2);
      L.style.top=top+"px";R.style.top=(top+L.offsetHeight+18)+"px";
    }else{                                                 // desktop: side by side, meeting at the gutter between the two columns of words
      var u=under.getBoundingClientRect(),cs=getComputedStyle(under),c1=parseFloat(cs.gridTemplateColumns),gap=parseFloat(cs.columnGap)||0,
          xL=u.left+c1,xR=xL+gap,m=Math.max(16,vw*.03);
      S=Math.round(Math.min(xL-m,vw-xR-m-120,vh*.55,440));  // 120px on the right for the pencil and colours
      L.style.width=R.style.width=S+"px";L.style.left=(xL-S)+"px";R.style.left=xR+"px";
      dispatchEvent(new Event("mailboxresize"));
      L.style.top=R.style.top=Math.max(64,vh/2-S/2)+"px";
    }
  }
  function setMail(on){
    if(on){if(window.setIndex&&stage.classList.contains("indexed"))setIndex(false);if(window.setGrid)setGrid(false);stage.classList.add("mailing");place()}
    else stage.classList.remove("mailing");
    box.setAttribute("aria-hidden",on?"false":"true");ic.setAttribute("aria-expanded",on?"true":"false");
  }
  window.setMail=setMail;
  addEventListener("resize",function(){if(stage.classList.contains("mailing"))place()});
  addEventListener("keydown",function(e){if(e.key==="Escape"&&stage.classList.contains("mailing"))setMail(false)});
})();
</script>
<script>
(function(){
  var mailForm=document.getElementById("mailForm"),ENDPOINT=mailForm.action;   // one address for the message and the drawings: the form's action
  var pad=document.getElementById("pad"),cv=document.getElementById("padCanvas"),ctx=cv.getContext("2d"),
      tool=document.getElementById("padTool"),fields=document.getElementById("fields"),
      send=document.getElementById("padSend"),status=document.getElementById("padStatus"),
      strokes=[],cur=null,on=true,color="#000000",size=3,                 // size = pencil thickness in px
      sizeEl=document.getElementById("padSize"),undo=document.getElementById("padUndo");

  function fit(){                                                        // pad = same size as the message form
    var h=fields.offsetHeight;if(h>60)pad.style.height=h+"px";
    var r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;
    cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));redraw();
  }
  function strokePath(g,pts,w,h,lw){
    g.lineWidth=lw;g.lineCap="round";g.lineJoin="round";g.beginPath();
    var p=function(i){return[pts[i][0]*w,pts[i][1]*h]},a=p(0),i;
    if(pts.length===1){g.moveTo(a[0],a[1]);g.lineTo(a[0]+.01,a[1])}
    else{
      g.moveTo(a[0],a[1]);
      for(i=1;i<pts.length-1;i++){var b=p(i),c=p(i+1);g.quadraticCurveTo(b[0],b[1],(b[0]+c[0])/2,(b[1]+c[1])/2)}
      var e=p(pts.length-1);g.lineTo(e[0],e[1]);
    }
    g.stroke();
  }
  function redraw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    var d=window.devicePixelRatio||1;strokes.forEach(function(s){ctx.strokeStyle=s.c;strokePath(ctx,s.p,cv.width,cv.height,s.w*d)});
  }
  function norm(e){var r=cv.getBoundingClientRect();return[Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]}
  cv.addEventListener("pointerdown",function(e){
    if(!on)return;e.preventDefault();cv.setPointerCapture(e.pointerId);cur={p:[norm(e)],c:color,w:size};status.textContent="";
  });
  cv.addEventListener("pointermove",function(e){
    if(!cur)return;cur.p.push(norm(e));redraw();ctx.strokeStyle=cur.c;
    var d=window.devicePixelRatio||1;strokePath(ctx,cur.p,cv.width,cv.height,cur.w*d);
  });
  function up(){if(!cur)return;strokes.push(cur);cur=null;redraw();syncUndo()}
  function syncUndo(){undo.disabled=!strokes.length}
  undo.addEventListener("click",function(){strokes.pop();redraw();syncUndo();status.textContent=""});      // go back: erase the last line
  cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);

  tool.addEventListener("click",function(){                              // pencil on / off
    setOn(!on);
  });
  function setOn(v){on=v;tool.classList.toggle("on",on);tool.setAttribute("aria-pressed",on?"true":"false");pad.classList.toggle("off",!on);dotCursor()}

  function dotCursor(){                                                  // the cursor is a dot: pencil size, pencil colour
    if(!on){pad.style.cursor="";return}
    var d=Math.max(2,size),S=Math.ceil(d)+6,h=Math.round(S/2);
    function make(k){
      var c=document.createElement("canvas");c.width=c.height=S*k;var g=c.getContext("2d");g.scale(k,k);
      g.beginPath();g.arc(S/2,S/2,d/2,0,Math.PI*2);g.fillStyle=color;g.fill();
      g.lineWidth=1;g.strokeStyle="rgba(0,0,0,.5)";g.stroke();return c.toDataURL("image/png");
    }
    var u1=make(1),u2=make(2);
    pad.style.cursor="url("+u1+") "+h+" "+h+", crosshair";
    pad.style.cursor="-webkit-image-set(url("+u1+") 1x, url("+u2+") 2x) "+h+" "+h+", crosshair";   // sharper on retina; ignored where unsupported
  }
  [].forEach.call(document.querySelectorAll(".padsw"),function(b){
    b.addEventListener("click",function(){
      color=b.getAttribute("data-c");
      [].forEach.call(document.querySelectorAll(".padsw"),function(o){o.classList.toggle("sel",o===b)});
      setOn(true);
    });
  });
  sizeEl.addEventListener("input",function(){size=+sizeEl.value;setOn(true)});
  /* ---- colour: one dot; click it for the colour wheel (any colour), the strip under the wheel goes from dark to light ---- */
  (function(){
    var sw=document.querySelector(".wheelsw");if(!sw)return;
    var pop=sw.parentNode.querySelector(".wheelpop"),wc=pop.querySelector("canvas"),mk=pop.querySelector(".wheelmark"),vs=pop.querySelector(".wheelv"),
        g=wc.getContext("2d"),drawn=false,down=false,H=0,S=0,V=0;          // starts black
    function hsv(h,s,v){var i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s),r,gg,b;
      switch(i%6){case 0:r=v;gg=t;b=p;break;case 1:r=q;gg=v;b=p;break;case 2:r=p;gg=v;b=t;break;case 3:r=p;gg=q;b=v;break;case 4:r=t;gg=p;b=v;break;default:r=v;gg=p;b=q}
      return[Math.round(r*255),Math.round(gg*255),Math.round(b*255)]}
    function hex(c){return"#"+c.map(function(v){return("0"+v.toString(16)).slice(-2)}).join("")}
    function draw(){                                        // white in the middle, full colour at the edge
      var W=wc.width,R=W/2,img=g.createImageData(W,W),d=img.data;
      for(var y=0;y<W;y++)for(var x=0;x<W;x++){var dx=x-R+.5,dy=y-R+.5,r=Math.sqrt(dx*dx+dy*dy),k=(y*W+x)*4;
        if(r>R){d[k+3]=0;continue}
        var c=hsv(((Math.atan2(-dy,dx)/(2*Math.PI))+1)%1,Math.min(1,r/R),1);d[k]=c[0];d[k+1]=c[1];d[k+2]=c[2];d[k+3]=r>R-1?Math.round(255*(R-r)):255}
      g.putImageData(img,0,0);drawn=true;
    }
    function apply(){
      var c=hex(hsv(H,S,V));sw.setAttribute("data-c",c);sw.style.setProperty("--c",c);color=c;
      vs.style.setProperty("--full",hex(hsv(H,S,1)));setOn(true);
    }
    function pick(e){
      var b=wc.getBoundingClientRect(),R=b.width/2,dx=e.clientX-b.left-R,dy=e.clientY-b.top-R,r=Math.min(R,Math.sqrt(dx*dx+dy*dy)),a=Math.atan2(-dy,dx);
      H=(a/(2*Math.PI)+1)%1;S=r/R;if(V<.05){V=1;vs.value=100}
      mk.style.left=(R+Math.cos(a)*r)+"px";mk.style.top=(R-Math.sin(a)*r)+"px";apply();
    }
    function open(v){pop.hidden=!v;sw.setAttribute("aria-expanded",v?"true":"false");if(v&&!drawn)draw()}
    sw.addEventListener("click",function(e){e.stopPropagation();open(pop.hidden)});
    wc.addEventListener("pointerdown",function(e){e.preventDefault();down=true;wc.setPointerCapture(e.pointerId);pick(e)});
    wc.addEventListener("pointermove",function(e){if(down)pick(e)});
    wc.addEventListener("pointerup",function(){down=false});
    vs.addEventListener("input",function(){V=+vs.value/100;apply()});
    pop.addEventListener("click",function(e){e.stopPropagation()});
    document.addEventListener("click",function(){if(!pop.hidden)open(false)});
    addEventListener("keydown",function(e){if(e.key==="Escape"&&!pop.hidden)open(false)});
    vs.style.setProperty("--full","#ffffff");
    /* move the wheel out of the way: drag it by its edge (the little bar on top or the white border); it stays where you leave it */
    var mv=null;
    pop.addEventListener("pointerdown",function(e){
      if(e.target.closest("canvas,input"))return;
      e.preventDefault();e.stopPropagation();var r=pop.getBoundingClientRect();
      pop.style.position="fixed";pop.style.left=r.left+"px";pop.style.top=r.top+"px";pop.style.right="auto";
      mv={dx:e.clientX-r.left,dy:e.clientY-r.top};pop.setPointerCapture(e.pointerId);pop.classList.add("moving");
    });
    pop.addEventListener("pointermove",function(e){
      if(!mv)return;var w=pop.offsetWidth,h=pop.offsetHeight;
      pop.style.left=Math.max(4,Math.min(innerWidth-w-4,e.clientX-mv.dx))+"px";
      pop.style.top=Math.max(4,Math.min(innerHeight-h-4,e.clientY-mv.dy))+"px";
    });
    function mvEnd(){mv=null;pop.classList.remove("moving")}
    pop.addEventListener("pointerup",mvEnd);pop.addEventListener("pointercancel",mvEnd);
  })();


  function picture(cb){
    var W=1200,H=Math.round(W*cv.height/cv.width),c=document.createElement("canvas");c.width=W;c.height=H;
    var g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,W,H);
    strokes.forEach(function(s){g.strokeStyle=s.c;strokePath(g,s.p,W,H,s.w*W/cv.getBoundingClientRect().width)});
    c.toBlob(cb,"image/png");
  }
  send.addEventListener("click",function(){
    if(!strokes.length){status.textContent="draw something first";return}
    send.disabled=true;status.textContent="sending…";
    picture(function(blob){
      var fd=new FormData();
      fd.append("attachment",blob,"drawing.png");
      fd.append("_subject","New drawing from the Office Oficina contact page");
      fd.append("_captcha","false");fd.append("_template","box");fd.append("_honey","");
      fd.append("message","Someone sent a drawing from the contact page. The picture is attached.");
      fetch(ENDPOINT,{method:"POST",body:fd,mode:"no-cors"}).then(function(){
        strokes=[];redraw();syncUndo();status.textContent="sent, thank you";
      }).catch(function(){status.textContent="couldn't send, please try again"}).then(function(){send.disabled=false});
    });
  });

  dotCursor();fit();addEventListener("resize",fit);addEventListener("mailboxresize",fit);
  if(window.ResizeObserver)new ResizeObserver(fit).observe(fields);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);

  /* ---- the message form: sends in the background, shows "sent" here ---- */
  var mailSend=document.getElementById("mailSend"),mailStatus=document.getElementById("mailStatus"),nativeSend=false;
  mailForm.addEventListener("submit",function(e){
    if(nativeSend)return;                                            // fallback: let the browser send it the normal way
    e.preventDefault();mailSend.disabled=true;mailStatus.textContent="sending…";
    fetch(mailForm.action.replace("formsubmit.co/","formsubmit.co/ajax/"),{method:"POST",body:new FormData(mailForm),headers:{Accept:"application/json"}})
      .then(function(r){return r.json()})
      .then(function(j){
        if(String(j.success)==="true"){mailForm.reset();mailStatus.textContent="sent, thank you"}
        else{nativeSend=true;mailForm.submit()}                      // e.g. first time: FormSubmit's own page explains the activation
      })
      .catch(function(){nativeSend=true;mailForm.submit()})
      .then(function(){mailSend.disabled=false});
  });
})();
</script>
<script>
/* ---- help: click the ? (top right) and the pointer turns into a ?; whatever you point at, the line in the bottom-left
   corner tells you what it does and what to do. Click the ? again, or press Esc, to stop. ---- */
(function(){
  var q=document.getElementById("helpq"),line=document.getElementById("helpline"),root=document.documentElement,on=false;
  function card(){return document.getElementById("card").classList.contains("open")}
  var TIPS=[                                         // first match wins: the most particular things first
    ["#helpq",function(){return on?"Help: click to turn help off (or press Esc).":"Help: click, then point at anything to see what it does."}],
    [".logo .m",function(){return card()?"Logo: click a dot to go back to the start; click the triangle to mirror it, then again to go back one step. Drag the shapes around; stack the two dots with the triangle to their left for a surprise.":"Logo: drag each shape into the card — the dots into the two O's, the triangle into the A — to unlock the card. Click a dot to go back to the start; click the triangle to mirror it, then again to go back one step."}],
    ["#gridbtn",function(){return document.querySelector(".stage").classList.contains("gridded")?"Grid: click to go back to the index.":"Grid: click to see all the projects as a grid of squares."}],
    ["#arrN","North: click to look at the north wall."],
    [".lvelev","North wall: the bench is a record shelf. Drag a record out of a cubby and drop it on the record player on the little table to play it. Click the wall to go back to the plan."],
    [".lvplan","Listening room: click the arrow at the top to look at the north wall. The logo takes you back to the start."],
    ["#rot","Turn: drag around the card to rotate it."],
    ["#flipF","Flip: click to turn the card over."],
    ["#listen","Door: click to open it and go in to the record room."],
    [".card",function(){return card()?"Card: click to go back to the start; drag to move it. Turn it with the arrow, flip it over, and on the back the A is a door. Drop it in the slot at the top to put it away.":"Card: click to go back to the start; drag to move it and uncover the words underneath. Fit the logo's three shapes into its O, O and A to unlock it."}],
    ["#slit",function(){return document.getElementById("card").style.visibility==="hidden"?"Slot: click to get the card back.":"Slot: drop the card in here to put it away. Click to put it away or get it back."}],
    ['[data-go="work"]',"Work: click to open the index of projects. Drag to move the word."],
    ['[data-go="about"]',"About: click to open the flip book about us. Drag to move the word."],
    ['[data-go="contact"]',"Contact: click to write us a message or send us a drawing. Drag to move the word."],
    ['[data-go="instagram"]',"Instagram: click to open our Instagram in a new tab. Drag to move the word."],
    [".under .w","Word: drag it anywhere."],
    [".index .pj img,.index .pj a","Project: click to see its drawings large. Click the image for the next one; Esc or the logo to go back."],
    [".pview","Project: click the image for the next one. Esc goes back to the index; the logo goes home."],
    [".ixc,.ixhead","Index: scroll each column on its own; text and drawings keep each other company. Esc or the logo to close."],
    [".gtext","Torre: the project's text. Click outside it, or press Esc, to go back to the grid."],
    [".gpic","Hover over the ground floor to see its plan and a photo. Click to go back to the grid."],
    [".gfl","The ground floor: plan and photo. Click outside them to go back to the grid."],
    [".gsq .sq.has","Project: click to open it."],
    [".gridv","Grid: scroll to see all the squares. Esc or the logo to close."],
    [".wheelpop","Colour: pick a colour on the wheel; the bar sets light or dark. Drag the edge to move it."],
    [".mailR","Drawing pad: draw with the mouse or a finger. The dot picks the colour. Send mails us your drawing."],
    [".mailL","Message: write your name, email and message, then Send. Esc or the logo to close."],
    ["#mix","Mix: shuffle the heads, bodies and legs."],
    [".aboutbook","About: click a strip to flip it — head, body, legs. Esc or the logo to close."]
  ];
  function tipFor(el){
    for(var i=0;i<TIPS.length;i++){var hit=el&&el.closest&&el.closest(TIPS[i][0]);if(hit){var t=TIPS[i][1];return typeof t==="function"?t():t}}
    return "Help is on: point at anything to see what it does. Click the ? or press Esc to stop.";
  }
  function show(t){line.textContent=t;line.classList.toggle("on",!!t)}
  function set(v){on=v;root.classList.toggle("help",v);q.setAttribute("aria-pressed",v?"true":"false");show(v?tipFor(q):"")}
  q.addEventListener("click",function(e){e.stopPropagation();set(!on)});
  q.addEventListener("pointerenter",function(){if(!on)show(tipFor(q))});
  q.addEventListener("pointerleave",function(){if(!on)show("")});
  addEventListener("pointermove",function(e){if(on)show(tipFor(e.target))},{passive:true});
  addEventListener("pointerdown",function(e){if(on&&e.pointerType!=="mouse")show(tipFor(e.target))},{passive:true});   // phones: touch something to read about it
  addEventListener("keydown",function(e){if(e.key==="Escape"&&on)set(false)});
})();
</script>
