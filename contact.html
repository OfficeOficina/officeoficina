<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Office Oficina</title>
<link rel="stylesheet" href="style.css?v=58">
</head>
<body>
<div class="contact" style="padding-top:calc(var(--H)*.16)">
  <a class="logo logolink" href="index.html" aria-label="Office Oficina: back to the home page">
    <span class="m dot"></span><span class="m dot"></span>
    <span class="m tri"><svg viewBox="0 0 39 37" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0L39 14.5V22.5L0 37Z"/></svg></span>
  </a>

  <!-- Messages and drawings are emailed to lucasjstrzelec@gmail.com through FormSubmit.
       To hide the address, replace it in the action below with the random code FormSubmit gives you after activation. -->
  <form id="mailForm" action="https://formsubmit.co/lucasjstrzelec@gmail.com" method="POST">
    <input type="hidden" name="_subject" value="New message from the Office Oficina website">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="box">
    <input type="text" name="_honey" value="" tabindex="-1" autocomplete="off" style="display:none">
    <div class="fields" id="fields">
      <label>Name <input name="name" required autocomplete="name"></label>
      <label>Email <input name="email" type="email" required autocomplete="email"></label>
      <label>Message <textarea name="message" required></textarea></label>
    </div>
    <div class="sendrow">
      <button type="submit" id="mailSend">Send</button>
      <span id="mailStatus" role="status"></span>
    </div>
  </form>

  <!-- drawing pad: same size as the message form, draw inside the dashed line -->
  <div class="padwrap">
    <div class="padtools" role="toolbar" aria-label="Drawing tools">
      <div class="padtop">
        <button class="padtool on" id="padTool" type="button" aria-pressed="true" aria-label="Pencil"><img src="pencil.png" alt=""></button>
        <button class="padundo" id="padUndo" type="button" aria-label="Go back (erase the last line)" title="Go back" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>
        </button>
      </div>
      <div class="padcolors" role="group" aria-label="Colours">
          <span class="wheelwrap"><button class="padsw wheelsw sel" type="button" data-c="#000000" style="--c:#000000" aria-label="Colour: open the colour wheel" aria-expanded="false"></button><span class="wheelpop" hidden><span class="wheelgrip" title="Drag to move"></span><span class="wheelarea"><canvas width="320" height="320" aria-label="Colour wheel: click or drag to pick a colour"></canvas><i class="wheelmark"></i></span><input class="wheelv" type="range" min="0" max="100" value="0" aria-label="Light to dark"></span></span>
      </div>
      <div class="padsize"><input id="padSize" type="range" min="1" max="24" value="3" aria-label="Thickness"></div>
    </div>
    <div class="pad" id="pad"><canvas id="padCanvas" aria-label="Drawing pad"></canvas></div>
  </div>
  <div class="padsend">
    <button type="button" id="padSend">Send</button>
    <span id="padStatus" role="status"></span>
  </div>
</div>

<script>
(function(){
  var mailForm=document.getElementById("mailForm"),ENDPOINT=mailForm.action;   // one address for the message and the drawings: the form's action
  var pad=document.getElementById("pad"),cv=document.getElementById("padCanvas"),ctx=cv.getContext("2d"),
      tool=document.getElementById("padTool"),fields=document.getElementById("fields"),
      send=document.getElementById("padSend"),status=document.getElementById("padStatus"),
      strokes=[],cur=null,on=true,color="#000000",size=3,                 // size = pencil thickness in px
      sizeEl=document.getElementById("padSize"),undo=document.getElementById("padUndo");

  function fit(){                                                        // pad = same size as the message form
    var h=fields.offsetHeight;if(h>60)pad.style.height=h+"px";
    var r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;
    cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));redraw();
  }
  function strokePath(g,pts,w,h,lw){
    g.lineWidth=lw;g.lineCap="round";g.lineJoin="round";g.beginPath();
    var p=function(i){return[pts[i][0]*w,pts[i][1]*h]},a=p(0),i;
    if(pts.length===1){g.moveTo(a[0],a[1]);g.lineTo(a[0]+.01,a[1])}
    else{
      g.moveTo(a[0],a[1]);
      for(i=1;i<pts.length-1;i++){var b=p(i),c=p(i+1);g.quadraticCurveTo(b[0],b[1],(b[0]+c[0])/2,(b[1]+c[1])/2)}
      var e=p(pts.length-1);g.lineTo(e[0],e[1]);
    }
    g.stroke();
  }
  function redraw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    var d=window.devicePixelRatio||1;strokes.forEach(function(s){ctx.strokeStyle=s.c;strokePath(ctx,s.p,cv.width,cv.height,s.w*d)});
  }
  function norm(e){var r=cv.getBoundingClientRect();return[Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]}
  cv.addEventListener("pointerdown",function(e){
    if(!on)return;e.preventDefault();cv.setPointerCapture(e.pointerId);cur={p:[norm(e)],c:color,w:size};status.textContent="";
  });
  cv.addEventListener("pointermove",function(e){
    if(!cur)return;cur.p.push(norm(e));redraw();ctx.strokeStyle=cur.c;
    var d=window.devicePixelRatio||1;strokePath(ctx,cur.p,cv.width,cv.height,cur.w*d);
  });
  function up(){if(!cur)return;strokes.push(cur);cur=null;redraw();syncUndo()}
  function syncUndo(){undo.disabled=!strokes.length}
  undo.addEventListener("click",function(){strokes.pop();redraw();syncUndo();status.textContent=""});      // go back: erase the last line
  cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);

  tool.addEventListener("click",function(){                              // pencil on / off
    setOn(!on);
  });
  function setOn(v){on=v;tool.classList.toggle("on",on);tool.setAttribute("aria-pressed",on?"true":"false");pad.classList.toggle("off",!on);dotCursor()}

  function dotCursor(){                                                  // the cursor is a dot: pencil size, pencil colour
    if(!on){pad.style.cursor="";return}
    var d=Math.max(2,size),S=Math.ceil(d)+6,h=Math.round(S/2);
    function make(k){
      var c=document.createElement("canvas");c.width=c.height=S*k;var g=c.getContext("2d");g.scale(k,k);
      g.beginPath();g.arc(S/2,S/2,d/2,0,Math.PI*2);g.fillStyle=color;g.fill();
      g.lineWidth=1;g.strokeStyle="rgba(0,0,0,.5)";g.stroke();return c.toDataURL("image/png");
    }
    var u1=make(1),u2=make(2);
    pad.style.cursor="url("+u1+") "+h+" "+h+", crosshair";
    pad.style.cursor="-webkit-image-set(url("+u1+") 1x, url("+u2+") 2x) "+h+" "+h+", crosshair";   // sharper on retina; ignored where unsupported
  }
  [].forEach.call(document.querySelectorAll(".padsw"),function(b){
    b.addEventListener("click",function(){
      color=b.getAttribute("data-c");
      [].forEach.call(document.querySelectorAll(".padsw"),function(o){o.classList.toggle("sel",o===b)});
      setOn(true);
    });
  });
  sizeEl.addEventListener("input",function(){size=+sizeEl.value;setOn(true)});
  /* ---- colour: one dot; click it for the colour wheel (any colour), the strip under the wheel goes from dark to light ---- */
  (function(){
    var sw=document.querySelector(".wheelsw");if(!sw)return;
    var pop=sw.parentNode.querySelector(".wheelpop"),wc=pop.querySelector("canvas"),mk=pop.querySelector(".wheelmark"),vs=pop.querySelector(".wheelv"),
        g=wc.getContext("2d"),drawn=false,down=false,H=0,S=0,V=0;          // starts black
    function hsv(h,s,v){var i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s),r,gg,b;
      switch(i%6){case 0:r=v;gg=t;b=p;break;case 1:r=q;gg=v;b=p;break;case 2:r=p;gg=v;b=t;break;case 3:r=p;gg=q;b=v;break;case 4:r=t;gg=p;b=v;break;default:r=v;gg=p;b=q}
      return[Math.round(r*255),Math.round(gg*255),Math.round(b*255)]}
    function hex(c){return"#"+c.map(function(v){return("0"+v.toString(16)).slice(-2)}).join("")}
    function draw(){                                        // white in the middle, full colour at the edge
      var W=wc.width,R=W/2,img=g.createImageData(W,W),d=img.data;
      for(var y=0;y<W;y++)for(var x=0;x<W;x++){var dx=x-R+.5,dy=y-R+.5,r=Math.sqrt(dx*dx+dy*dy),k=(y*W+x)*4;
        if(r>R){d[k+3]=0;continue}
        var c=hsv(((Math.atan2(-dy,dx)/(2*Math.PI))+1)%1,Math.min(1,r/R),1);d[k]=c[0];d[k+1]=c[1];d[k+2]=c[2];d[k+3]=r>R-1?Math.round(255*(R-r)):255}
      g.putImageData(img,0,0);drawn=true;
    }
    function apply(){
      var c=hex(hsv(H,S,V));sw.setAttribute("data-c",c);sw.style.setProperty("--c",c);color=c;
      vs.style.setProperty("--full",hex(hsv(H,S,1)));setOn(true);
    }
    function pick(e){
      var b=wc.getBoundingClientRect(),R=b.width/2,dx=e.clientX-b.left-R,dy=e.clientY-b.top-R,r=Math.min(R,Math.sqrt(dx*dx+dy*dy)),a=Math.atan2(-dy,dx);
      H=(a/(2*Math.PI)+1)%1;S=r/R;if(V<.05){V=1;vs.value=100}
      mk.style.left=(R+Math.cos(a)*r)+"px";mk.style.top=(R-Math.sin(a)*r)+"px";apply();
    }
    function open(v){pop.hidden=!v;sw.setAttribute("aria-expanded",v?"true":"false");if(v&&!drawn)draw()}
    sw.addEventListener("click",function(e){e.stopPropagation();open(pop.hidden)});
    wc.addEventListener("pointerdown",function(e){e.preventDefault();down=true;wc.setPointerCapture(e.pointerId);pick(e)});
    wc.addEventListener("pointermove",function(e){if(down)pick(e)});
    wc.addEventListener("pointerup",function(){down=false});
    vs.addEventListener("input",function(){V=+vs.value/100;apply()});
    pop.addEventListener("click",function(e){e.stopPropagation()});
    document.addEventListener("click",function(){if(!pop.hidden)open(false)});
    addEventListener("keydown",function(e){if(e.key==="Escape"&&!pop.hidden)open(false)});
    vs.style.setProperty("--full","#ffffff");
    /* move the wheel out of the way: drag it by its edge (the little bar on top or the white border); it stays where you leave it */
    var mv=null;
    pop.addEventListener("pointerdown",function(e){
      if(e.target.closest("canvas,input"))return;
      e.preventDefault();e.stopPropagation();var r=pop.getBoundingClientRect();
      pop.style.position="fixed";pop.style.left=r.left+"px";pop.style.top=r.top+"px";pop.style.right="auto";
      mv={dx:e.clientX-r.left,dy:e.clientY-r.top};pop.setPointerCapture(e.pointerId);pop.classList.add("moving");
    });
    pop.addEventListener("pointermove",function(e){
      if(!mv)return;var w=pop.offsetWidth,h=pop.offsetHeight;
      pop.style.left=Math.max(4,Math.min(innerWidth-w-4,e.clientX-mv.dx))+"px";
      pop.style.top=Math.max(4,Math.min(innerHeight-h-4,e.clientY-mv.dy))+"px";
    });
    function mvEnd(){mv=null;pop.classList.remove("moving")}
    pop.addEventListener("pointerup",mvEnd);pop.addEventListener("pointercancel",mvEnd);
  })();


  function picture(cb){
    var W=1200,H=Math.round(W*cv.height/cv.width),c=document.createElement("canvas");c.width=W;c.height=H;
    var g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,W,H);
    strokes.forEach(function(s){g.strokeStyle=s.c;strokePath(g,s.p,W,H,s.w*W/cv.getBoundingClientRect().width)});
    c.toBlob(cb,"image/png");
  }
  send.addEventListener("click",function(){
    if(!strokes.length){status.textContent="draw something first";return}
    send.disabled=true;status.textContent="sending…";
    picture(function(blob){
      var fd=new FormData();
      fd.append("attachment",blob,"drawing.png");
      fd.append("_subject","New drawing from the Office Oficina contact page");
      fd.append("_captcha","false");fd.append("_template","box");fd.append("_honey","");
      fd.append("message","Someone sent a drawing from the contact page. The picture is attached.");
      fetch(ENDPOINT,{method:"POST",body:fd,mode:"no-cors"}).then(function(){
        strokes=[];redraw();syncUndo();status.textContent="sent, thank you";
      }).catch(function(){status.textContent="couldn't send, please try again"}).then(function(){send.disabled=false});
    });
  });

  dotCursor();fit();addEventListener("resize",fit);
  if(window.ResizeObserver)new ResizeObserver(fit).observe(fields);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);

  /* ---- the message form: sends in the background, shows "sent" here ---- */
  var mailSend=document.getElementById("mailSend"),mailStatus=document.getElementById("mailStatus"),nativeSend=false;
  mailForm.addEventListener("submit",function(e){
    if(nativeSend)return;                                            // fallback: let the browser send it the normal way
    e.preventDefault();mailSend.disabled=true;mailStatus.textContent="sending…";
    fetch(mailForm.action.replace("formsubmit.co/","formsubmit.co/ajax/"),{method:"POST",body:new FormData(mailForm),headers:{Accept:"application/json"}})
      .then(function(r){return r.json()})
      .then(function(j){
        if(String(j.success)==="true"){mailForm.reset();mailStatus.textContent="sent, thank you"}
        else{nativeSend=true;mailForm.submit()}                      // e.g. first time: FormSubmit's own page explains the activation
      })
      .catch(function(){nativeSend=true;mailForm.submit()})
      .then(function(){mailSend.disabled=false});
  });
})();
</script>
<script>
/* the logo: drag any of the three shapes around; a click (without dragging) takes you home */
(function(){
  var link=document.querySelector(".logolink");if(!link)return;
  link.addEventListener("click",function(e){e.preventDefault()});
  [].forEach.call(link.querySelectorAll(".m"),function(m){
    var x=0,y=0,d=null;
    m.addEventListener("pointerdown",function(e){e.preventDefault();d={px:e.clientX,py:e.clientY,x:x,y:y,moved:false};m.setPointerCapture(e.pointerId);m.classList.add("dragging")});
    m.addEventListener("pointermove",function(e){
      if(!d)return;if(!d.moved){if(Math.hypot(e.clientX-d.px,e.clientY-d.py)<5)return;d.moved=true}
      var ox=x,oy=y;x=d.x+e.clientX-d.px;y=d.y+e.clientY-d.py;m.style.transform="translate("+x+"px,"+y+"px)";
      var r=m.getBoundingClientRect();if(r.right<12||r.left>innerWidth-12||r.bottom<12||r.top>innerHeight-12){x=ox;y=oy;m.style.transform="translate("+x+"px,"+y+"px)"}
    });
    function up(){var was=d;d=null;m.classList.remove("dragging");if(was&&!was.moved)location.href=link.getAttribute("href")}
    m.addEventListener("pointerup",up);m.addEventListener("pointercancel",function(){d=null;m.classList.remove("dragging")});
  });
  link.addEventListener("keydown",function(e){if(e.key==="Enter")location.href=link.getAttribute("href")});
})();
</script>
</body>
</html>
